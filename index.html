y heart\nYou just say one word\nI open up my heart to you, to you\nI need a word from You\nThat's why I open up my heart"}, {"title": "나는 예배자입니다", "lyrics": "주님의 마음이 있는 곳\n주님의 시선이 있는 곳\n내가 있기 원하네\n광야에 꽃을 피우시고\n사막에 강물을 내시는\n주의 놀라운 손길\n풀은 마르고 꽃은 시드나\n주의 말씀은 영원하네\n전능하신 주 거룩하신 왕\n주님의 말씀 이루시네\n나의 맘 주의 성전이 되어\n영원한 주의 말씀을 향해\n주의 마음 있는 곳으로\n나의 삶 주의 말씀을 따라\n이루실 주의 나라를 향해\n주의 시선 있는 곳\n주님의 마음 있는 곳\n주님의 시선 있는 곳\n내가 있기 원하네"}, {"title": "물 가운데 지날 때에도", "lyrics": "Verse\n물 가운데 지날 때에도 \n침몰치 않으며 \n불 가운데 행할 때에도 \n너를 상치 못하게 하시리 \n너를 지명하여 부르신 \n하나님 큰 사랑 \n너를 구속하여 살리신 \n하나님 네게 말씀하시네 \nChorus\n두려워 말라 \n놀라지도 말라 \n네가 어딜 가든지 무슨 일 만나든지 \n내가 함께 하리라 \n두려워 말라 \n놀라지도 말라 \n내 너를 붙들리라 너를 도우리라 \n주님 약속하셨네"}, {"title": "어둔 날 다 지나고", "lyrics": "Verse\n어둔 날 다 지나고\n그가 빛을 발하리\n쓰러져 가는 우리 영혼\n주가 붙잡아 주시리\n우린 쉬지 않으리\n이 길에 끝이 있으니\n한 걸음 한 걸음\n주와 함께 걸으리\nPre Chorus\n우리의 걸음이\n끝나는 그날\n매순간 함께 하신 이\n우릴 안아주시리\n더이상 눈물 없으리\n당신의 그 나라 안에서\n이제 영원히 주 품 안에서\n우리 찬양하겠네\nChorus\n우리 가는 이 길\n세상이 미련하다 해도\n우리는 주가 보여주신\n그 한 소망 있으니\n어둠의 조각조차\n그 곳에 발 들이지 못해\n당신의 나라에\n우리 영원히 거하네"}, {"title": "Letters of Christ", "lyrics": "Verse \nLet us be your letters\nLet your aroma flow through us\nLet us walk with you in faith\nand not be swayed by sight\nLet us be your letters\nLet your aroma flow through us\nLet us walk with you in faith\nand not be swayed by sight\nPre-Chorus\nLet people see you through us\nLet us be your vessel of love\nLet us lift your glory up high\nand let your kingdom come\nChorus\nAnd we will GO so send US\nWe will march in victory\nFor you are here upholding us\nNothing can hold us back\nAnd we will GO so send US\nWe will march in victory\nFor you are here upholding us\nNothing can hold us back\nBridge\nLord Bless this place, your people\nwith grace, your power\nLord Bless this place, your people\nwith love, your comfort\nLord Bless this place, your people\nwith grace, your power\nLord Bless this place, your people\nwith love, your comfort"}, {"title": "오셔서 다스리소서", "lyrics": "오셔서 다스리소서\n산과 시내와 붉은 노을과\n땅의 모든것 주 다스리네\n내안의 갈망 유일한 소망\n주님 날 다스리는 것\n생각을 넘어 모든 말보다\n나의 생활이 말하게 하소서\n세상 그 어떤 것보다 소중한\n내 주님 날 이끄심을 \n주 오셔서 통치하소서 \n헛된 나의 꿈 어둠 거두사\n내 모든 것 다 드리니\n오셔서 다스리소서\nChorus 2\n주 오셔서 통치하소서 \n헛된 나의 꿈 어둠 거두사\n다시 한번 나의 주님 \n오셔서 다스리소서\n오셔서 다스리소서\n오셔서 다스리소서"}, {"title": "영광스런 주를 보라", "lyrics": "Verse 1\n영광스런 주를 보라\n고난 받은 그 모습\n승리하고 오실 때\n만민 경배하리라\n왕의 왕이 되신 주께 \n면류관을 드리세 \n왕의 왕이 되신 주께\n면류관을 드리세\nVerse 2\n양의 문이 되신 예수여\n우리 영접하시고\n길을 잃은 양의 무리를\n항상 인도하소서\n선한 목자 구세주여\n기도 들어주소서\n선한 목자 구세주여\n기도 들어주소서\nVerse 3\n흠이 많고 약한 우리를\n용납하여 주시고\n주의 넓고 크신 은혜로\n자유 얻게 하소서\n선한 목자 구세주여\n지금 나아갑니다\n선한 목자 구세주여\n지금 나아갑니다\nVerse 4\n일찍 주의 뜻을 따라서\n살아가게 하시고\n주의 크신 사랑 베푸사\n따라가게 하소서\n선한 목자 구세주여\n항상 인도하소서\n선한 목자 구세주여\n항상 인도하소서"}, {"title": "허락하신 새 땅에", "lyrics": "Verse 1\n허락하신 새 땅에\n들어가려면\n맘에 준비 다하여\n힘써 일하세\nChorus\n여호수아 본받아\n앞으로 가세\n우리 거할 처소는\n주님 품일세\nVerse 2\n시험 환난 당해도\n낙심말고서\n맘에 걱정 버리고\n힘써 일하세\nVerse 3\n앞서 가신 예수님\n바라 보면서\n모두 맘을 합하여\n힘써 일하세\nVerse 4\n일할 곳이 아직도\n많이 있으니\n담대하게 나가서\n힘써 일하네"}, {"title": "예수보다 더 큰 사랑", "lyrics": "Verse \n예수보다 더 큰 사랑 \n그 누구도 줄 수 없네 \n우리에게 자유 주신 \n그 큰 사랑\nBridge\n세상의 헛된 보화 \n곧 사라지지만 \n영원한 주님의 사랑 \n나의 맘에 남으리\nChorus\n찬양하세 영원히 \n변치않는 그 사랑 \n위대한 그 사랑 \n내 죄 씻었네\n세상 모든 능력과 \n권세보다 강하신 \n영원한 그 사랑"}, {"title": "평화 하나님의 평강이", "lyrics": "Verse 2\n기쁨\n하나님의 기쁨이\n당신의 삶에\n넘쳐나기를\n기쁨\n하나님의 기쁨이\n당신의 삶에\n가득하기를 축복합니다\nVerse 3\n소망\n하나님의 소망이\n당신의\n삶에 넘쳐나기를\n소망\n하나님의 소망이\n당신의 삶에\n가득하기를 축복합니다"}, {"title": "선하신 나의 주", "lyrics": "Verse \n선하신 나의 주\n주 항상 내 안에 계셔서\n어둠을 밀어내사\n오늘도 새 노래 주시네\n나 서있는 이곳은\n여전히 소망 없다 하나\n내 주 예수 친히 예비하신\n하나님 나라 바라보네\nChorus 1\n찬양해 만왕의 왕\n그의 나라 영원하도다\n경배해 만유의 주 예수\n복되신 구세주 찬양해\nBridge\n주 사랑 영원하고\n주 은혜 끝이 없네\n온 만물아 크게 선포하라\n온 백성 구속하신 왕께\n주 사랑 영원하고\n주 은혜 끝이 없네\n온 만물아 크게 선포하라\n그 이름\n큰 소리 높여 찬양해\n만왕의 왕\n그의 나라 영원하도다\nChorus 2\n경배해 만유의 주 예수\n온 세상 다스리네\n그 영광 다 찬양해\n만왕의 왕\n그의 나라 영원하도다\n경배해 만유의 주 예수\n복되신 구세주 찬양해\nChorus 3\n찬양해 만왕의 왕\n그의 나라 영원하도다\n경배해 만유의 주 예수\n복되신 구세주 찬양해"}, {"title": "You are my all in all (주 나의 모든 것)", "lyrics": "Verse 1\nYou are my strength when I am weak\nYou are the treasure that I seek\nYou are my all in all\nSeeking You as a precious jewel\nLord, to give up I'd be a fool\nYou are my all in all\nVerse 2\nTaking my sin, my cross, my shame\nRising again, I bless Your name\nYou are my all in all\nWhen I fall down You pick me up\nWhen I am dry You fill my cup\nYou are my all in all\nChorus \nJesus, Lamb of God\nWorthy is Your name"}, {"title": "주를 더욱 사랑", "lyrics": "Verse \n예수보다 더 큰 사랑 \n그 누구도 줄 수 없네 \n우리에게 자유 주신 \n그 큰 사랑\nBridge\n세상의 헛된 보화 \n곧 사라지지만 \n영원한 주님의 사랑 \n나의 맘에 남으리\nChorus\n찬양하세 영원히 \n변치않는 그 사랑 \n위대한 그 사랑 \n내 죄 씻었네\n세상 모든 능력과 \n권세보다 강하신 \n영원한 그 사랑"}, {"title": "주를 더욱 사랑", "lyrics": "Verse 1\n나 주와 함께 걷기 원해요 \n주님 곁에 날 품어주세요\n언제나 주의 진리 날 감동해 \n내 영혼 오직 주님만 갈망하네\nVerse 2\n주님 내 곁에 머물러 주세요 \n주 얼굴 볼때 커지는 사랑\n주 앞에 나의 모든 것 버리고 \n내 사랑 주님 따르기 갈망하네\nChorus\n나의 사랑이 더욱 커져가네\n주를 향한 내 사랑 더욱 깊어져만 가네"}, {"title": "주를 더욱 사랑", "lyrics": "Verse 1\n갈보리 십자가 드높이 섰도다\n존귀하신 어린 양\n \nVerse 2\n하나님의 능력 하나님의 지혜\n예수 십자가 사랑\nPre Chorus\n이해 할 수 없는 죽음 뒤의 승리\n그리스도 생명의 반석\nChorus\n주를 더욱 사랑 \n아름다우신 주\n온 맘 다해 온 힘 다해 \n모두 드리리 \n주를 더욱 사랑 \n아름다우신 주 \n온 맘 다해 온 힘 다해 \n주를 경배해\nBridge\n최후 승리를 얻기까지\n주의 십자가 사랑하리 \n빛난 면류관 받기까지 \n험한 십자가 붙들겠네"}, {"title": "찬송가 117장: 만백성 기뻐하여라", "lyrics": "만백성 기뻐하여라 \n하늘의 평화가\n저 마귀 권세 이기고\n우리를 구했네\n구세주 탄생하심을\n다 함께 기리세\nChorus\n오 기쁘다 반가운 \n소식 주 오셨네\n--\n땅 위에 평화 \n내려 주시네\nVerse2\n양치는 목자들에게 \n한 천사 나타나\n그 전한 기쁜 소식은 \n이 세상 구원할\n하나님 독생 성자가 \n&#xA;\n탄생하심이라\nVerse3\n그 천사들이 전한 말 \n무서워 말아라\n동정녀 몸을 빌려서 \n주 탄생하셨네\n저 하늘에 영광 영광\n땅에는 평화라"}, {"title": "All to Jesus I Surrender", "lyrics": "CHORUS\nI surrender all,\nI surrender all,\nAll to Thee, my blessed Savior,\nI surrender all"}, {"title": "천사들의 노래가", "lyrics": "천사들의 노래가 \n하늘에서 들리니\n산과 들이 기뻐서 \n메아리 쳐 울린다\nVerse2\n한밤 중에 목자들 \n저희 양 때 지킬 때\n아름다운 노래가 \n청아하게 들린다\nVerse3\n베들레헴 달려가 \n나신 아기 예수께\n꿇어 경배 합시다 \n탄생하신 아기께\nVerse4\n구유 안에 아기께 \n천사 찬송하였다\n우리들도 주님께 \n기쁜 찬송 부르자\n&#xA;\nTag\n&#xA;\n영광을 높이 계신 주께\n&#xA;\n영광을 높이 계신 주께\nChorus\n영광을 높이 계신 주께\n영광을 높이 계신 주님께"}, {"title": "구주를 생각만 해", "lyrics": "Verse1\n&#xA;\n구주를 생각만 해도 이렇게 좋거든\n&#xA;\n주 얼굴 뵈올 때에야 얼마나 좋으랴\n&#xA;\n&#xA;\nVerse5\n사랑의 구주 예수여 내 기쁨 되시고\n&#xA;\n이제로부터 영원히 영광이 되소서\n&#xA;\n&#xA;\nTag\n&#xA;\n아멘"}, {"title": "그 맑고 환한 밤중에", "lyrics": "verse1\n그 맑고 환한 밤 중에 뭇 천사 내려와\n그 손에 비파 들고서 다 찬송 하기를\nChorus 1\n평강의 왕이 오시니 다 평안하여라\n그 소란하던 세상이 다 고요하도다\nVerse 2\n뭇 천사 날개 펴고서 이 땅에 내려와\n그 때에 부른 노래가 또 다시 들리니\nChorus 2\n이 슬픔 많은 세상에 큰 위로 넘치고\n온 세상 기뻐 뛰놀며 다 찬송하도다\nVerse 3\n옛 선지 예언 응하여 베들레헴 성 중에\n주 예수 탄생하시니 온 세상 구주라\nChorus 3\n저 천사 기쁜 노래를 또다시 부르니\n온 세상 사는 사람들 다 화답하도다\nTag\n다 찬송하도다 \n다 화답하도다"}, {"title": "교육부 특송", "lyrics": "Verse1\n해피 해피 \n크리스마스\n아름다운 \n크리스마스\n아기 예수님이 \n태어나신 날\n메리 메리 \n크리스마스\n기다려요 \n크리스마스\n찬양 소리 크게 \n울려 퍼지네\nVerse 2\n찬양 소리 크게 \n울려 퍼지네\n찬양 소리 \n크게 울려 퍼지네\nVerse 3\n너와 나의 모습이\n예수님 닮아\n너와 나의 모습이 \n예수님 닮아\n하루 이틀 매일 매일\n지날 때마다\n더 닮아가기 원해요\nVerse 4\n예수님 사랑이 \n넘쳐 넘쳐\n예수님 축복이 \n흘러 흘러\n예수님 은혜가 \n가득 가득\n당신과 함께 하기 원해요"}, {"title": "청년/대학부 특송", "lyrics": "Verse1\nWe wish you a merry Christmas\nWe wish you a merry Christmas\nWe wish you a merry Christmas \nand a happy new year\nGood tidings to you \nwherever you are\nWe wish you a merry Christmas \nand a happy new year\nVerse 2\n기다리나요 하얀 눈송이 \n(아니아니)\n기다리나요 빨간 산타클로스 \n(아니아니)\n기다리나요 멋진 장난감 \n(아니아니)\n기다려요 아기 예수님을\n기다리나요 하얀 눈송이 \n(아니아니)\n기다리나요 빨간 산타클로스 \n(아니아니)\n기다리나요 멋진 장난감 \n(아니아니)\n기다려요 난 아기 예수님을\n나를 위해 이 땅에 오신 \n하나님의 사랑하는 아들\n기다려요 난 아기 예수님\n내가 가장 사랑하는 분\n나는 기다려요 \n아기 예수님을\n나를 위해 이 땅에 오신\n온 세상을 구원하신 왕\nVerse 3\n기쁘다 구주 오셨네 \n만 백성 맞아라\n온 교회여 다 일어나\n다 찬양하여라 다 찬양하여라\n다 찬양 찬양하여라\n다 찬양 찬양하여라\nVerse 4\n아기 예수님의 오심을 기다리며 \n생각하고 기억합니다\n값없이 주시는 하나님의 참 사랑\n외아들을 이 땅에 보내셨네\n값없이 주시는 하나님의 참 사랑 \n외아들을 이 땅에 보내셨네\nVerse 5\n죄 없으신 하나님의 어린양\n하늘의 보좌를 버리시고\n이 땅에 빛으로 오신 예수님\n모든 죄악의 어둠이 물러가네\n오 영광 오 영광\n저 하늘의 영광이 찬란해\n오 평화 오 평화\n이 땅 위에 평화가 넘쳐나네\nVerse 6\n하얀눈이 내려와 \n온세상 가득히 쌓이면\n모두가 즐거워 \n기쁜 춤을 추리\n어린이도 노인도 \n모두 함께 찬양드려요\n이 땅에 나신 아기 예수님께\n축하해요 생일을 축하해요\n축하해요 예수님"}, {"title": "장년/가정 교구 특송", "lyrics": "Verse1\n고요한 밤에 거룩한 밤에\n우릴 위해 구주가 나신 이 밤에\n고요한 밤에 거룩한 밤에 \n아기 예수 말구유 위에 곤히 자네\n가장 낮은 곳으로 \n하늘의 사랑이 오셨네\n죄에 매여 소망 없는 우릴 위해\n가장 낮은 곳으로 \n하늘의 사랑이 오셨네\n온 세상 기뻐해 주 여기 나셨다\n고요한 밤 거룩한 밤 \n하늘과 땅 위에 참 평화가 임했네\n고요한 밤 거룩한 밤 \n우리 구주 나신 이 밤\n고요한 밤 거룩한 밤 \n하늘과 땅 위에 참 평화가 임했네\n고요한 밤 거룩한 밤 \n우리 구주 나신 이 밤\nVerse 2\n고요한 밤 거룩한 밤 \n주 예수 나신 밤\n그의 얼굴 광채가 \n세상 빛이 되셨네\n구주 나셨도다 \n구주 나셨도다\n구주 나셨도다 \n구주 나셨도다"}, {"title": "그 사랑이 내려와", "lyrics": "Verse 1\n고난중에 주 음성 \n들을 수 없다 해도\n참된 진리 되신 주\n나는 붙드네\n폭풍이 몰려와도\n험한 길을 간대도\n믿음의 두 손 들고\n주 신뢰해\nPrechorus\n내게 행하신 그 놀라운 일\n생명 주신 주를 기억하네\nChorus\n그 사랑이 내려와\n날 자유케 하셨네\n영원히 나는 주님의 것\n산과 골짜기에서\n내 영혼 노래하네\n영원히 나는 주님의 것\nVerse 2\n주의 약속 이뤄져\n소망이 넘칠 때에도\n은혜로운 주 손길 느낄 때도\n주를 향한 갈망과\n겸손한 마음으로\n믿음의 두 손들고\n주 찬양해\nVerse 2.1\n주를 향한 갈망과\n겸손한 마음으로\n믿음의 두 손들고\n주 찬양해\nBridge\n나의 삶 주의 것\n내 모든 삶 오직 주의 것"}, {"title": "좋으신 하나님", "lyrics": "Title\n좋으신 하나님\nVerse 1\n좋으신 하나님 \n좋으신 하나님\nVerse 2\n우리의 기도를 응답해 주시는\n참 좋으신 나의 하나님\nVerse 3\n한 없는 축복을 우리게 주시는\n참 좋으신 나의 하나님\nChorus\n참 좋으신 나의 하나님"}, {"title": "너 예수께  조용히 나가", "lyrics": "너 예수께 조용히 나가\n네 모든 짐 내려 놓고\n주 십자가 사랑을 믿어 \n죄 사함을 너 받으라\nChorus\n주 예수께 조용히 나가\n네 마음을 쏟아노라\n늘 은밀히 보시는 주님\n큰 은혜를 베푸시리\nVerse 2\n주 예수의 은혜를 입어 \n네 슬픔이 없어지리 \n네 이웃을 늘 사랑하여 \n너 받은 것 거저주라\nVerse 3\n주 예수를 친구로 삼아\n늘  네 옆에 모시어라\n그 영원한 생명 샘물에\n네 마른 목 축이어라\nVerse 4\n너 주님과 사귀어 살면\n새 생명이 넘치리라\n주 예수를 찾는 이 앞에 \n참 밝은 빛 비추어라"}, {"title": "화평을 누리자", "lyrics": "죄인된 우릴 위해 \n이 땅에 오신 예수 \n십자가에 달려 그 피로 \n내 죄 씻었네 \n누구든지 그 이름 \n부르는 자들마다 \n믿음으로 우릴\n의인으로 칭하셨네\nVerse2\n아버지 뜻 따라 \n순종하신 주 예수 \n그를 믿는 모든 \n자들을 구원하셨네 \n우리를 구원하신 \n그리스도의 보혈 \n죽음에서 영원한 \n생명으로 옮기셨네 \nChorus\n생명을 주신 주 \n의롭게 하셨네 \n자유를 주신 주 \n그 이름 찬양해\nBridge \n주님의 그 사랑 \n우릴 구원하셨네 \n주님의 그 은혜 \n화평케 하시네"}, {"title": "다시 복음 앞에", "lyrics": "Verse \n많은 이들 말하고 많은 이들 노래는 하지만 \n정작 가진 않는 길 \n두려운 생각보다 많이 힘들고 험한 길보단 \n그저 말로만 가려기에 \nPre Chorus \n점점 멀어져만 가네\n내게 생명 주었던 그 길 \n점점 이용하려 하네\n내게 사랑 주었던 그 길\nChorus \n다시 복음 앞에 내 영혼 서네 \n주님 만난 그 때 \n나 다시 돌아가 \n주님께 예배 드리며 \n다시 십자가의 길 걸으리"}, {"title": "하나님 선하시다", "lyrics": "Verse 1 \n모든 것 들으시는 주 \n신실한 그 영광 이곳에 임하네 \n회복을 약속하신 주 \n엎드려 경배와 감사로 찬양해 \nVerse 2\n은혜를 베푸시는 주 \n인자와 자비가 죄의 사슬 끊네 \n높으신 그 위엄 앞에 \n세상 모든 권세 두려움에 떠네 \nChorus 1\n하나님 선하시다 \n하나님 선하시다 \n주신 모든 약속 반드시 이루신다\n그 사랑 영원하다 \n그 사랑 영원하다 \n주 앞에 나온 자 버리지 않으신다\nChorus 2 \n하나님 선하시다 \n하나님 선하시다 \n주신 모든 약속 반드시 이루신다\n그 사랑 영원하다 \n그 사랑 영원하다 \n주 앞에 나온 자 반드시 살리신다\nBridge \n어제와 오늘을 돌보신 하나님\n그 은혜 인하여 온 땅이 기뻐해\n우리의 몸과 맘 주님께 드리니\n거룩한 산 제물 받아주옵소서"}, {"title": "나는 찬양하리라", "lyrics": "Verse 1 \n나는 찬양하리라 주님\n그 이름 찬양 예수 \n크신 주 이름 나 찬양하리라\n나는 찬양하리라 주님\n그 이름 찬양 예수 \n크신 주 이름 나 찬양하리라\nVerse 2\n나는 영광 돌리리 주께\n영광의 이름 예수 \n크신 주 이름 나 찬양하리라 \n나는 영광 돌리리 주께 \n영광의 이름 예수 \n크신 주 이름 나 찬양하리라"}, {"title": "네 맘과 정성을 다하여서", "lyrics": "네 맘과 정성을 다하여서\n주 너의 하나님을 사랑하라\n&#xA;\n네 몸을 아끼고 사랑하듯\n형제와 이웃을 사랑하라\n주께서 우리게 명하시니\n그 명령 따라서 살아가리\nVerse 2\n널 미워 해치는 원수라도\n언제나 너그럽게 사랑하라\n널 핍박 하는 자 위해서도\n신실한 맘으로 복을 빌라\n주께서 우리게 명하시니\n그 명령 따라서 살아가리\nVerse 3\n나 항상 주님을 멀리하고\n형제를 사랑하지 못하였다\n이러한 죄인을 사랑하사\n주께서 몸 버려 죽으셨다\n속죄의 큰 사랑 받은 이 몸\n내 생명 다 바쳐 충성하리\nTag\n아멘"}, {"title": "마음 속에 어려움이 있을 때", "lyrics": "마음 속에 어려움이 있을 때\n마음 속에 어려움이 있을 때\n마음 속에 어려움이 있을 때\n주님 내게 먼저오사 내 맘을 만지고\nChorus\n그럼에도 불구하고 날 사랑하시는\n내 하나님의 사랑은 나의 모든 걸 덮고\n그럼에도 불구하고 날 안아주시는\n내 하나님을 부를 때 아버지라 부르죠"}, {"title": "나같은 죄인 살리신", "lyrics": "Verse1\n나 같은 죄인 살리신 \n주 은혜 놀라워\n잃었던 생명 찾았고 \n광명을 얻었네\nVerse2\n큰 죄악에서 건지신\n주 은혜 고마워\n나 처음 믿은 그 시간 \n귀하고 귀하다\nChorus\n나의 결박 푸셨도다\n나의 구세주 대속했네\n넘쳐나는 주의 자비\n주의 사랑 주의 은혜\n&#xA;\nVerse3\n이제껏 내가 산 것도 \n주님의 은혜라\n또 나를 장차 본향에 \n인도해주시리\nVerse4\n거기서 우리 영원히 \n주님의 은혜로 \n해처럼 밝게 살면서 \n주 찬양 하리라"}, {"title": "나 이제 주님의 새 생명 얻은 몸", "lyrics": "Title\n나 이제 주님의 새 생명 얻은 몸\n나 이제 주님의 새 생명 얻은 몸\n옛 것은 지나고 새 사람이로다\n그 생명 내 맘에 강 같이 흐르고\n그 사람 내게서 해 같이 빛난다\nVerse 2\n주 안에 감추인 새 생명 얻으니\n이전에 좋던 것 이제는 값 없다\n하늘의 은혜와 평화를 맛보니\n찬송과 기도로 주 함께 살리라\nVerse 3\n산천도 초목도 새 것이 되었고\n죄인도 원수도 친구로 변한다\n새 생명 얻은 자 영생을 누리니\n주님을 모신 맘 새 하늘이로다\nVerse 4\n주 따라 가는길 험하고 멀어도\n찬송을 부르며 뒤따라 가리라\n나 주를 모시고 영원히 살리라\n날마다 섬기며 주 함께 살리라\nChorus\n영생을 누리며 주 안에 살리라\n오늘도 내일도 주 함께 살리라\nTag\n아멘"}, {"title": "어둔 밤 마음에 잠겨", "lyrics": "Verse 1\n어둔 밤 마음에 잠겨\n역사에 어둠 짙었을 때에\n계명성 동쪽에 밝아\n이 나라 여명이 왔다\n고요한 아침의 나라\n빛 속에 새롭다\n이 빛 삶 속에 얽혀\n이 땅에 생명탑 놓아간다\nVerse 2\n옥토에 뿌리는 깊어\n하늘로 줄기가지 솟을 때\n가지잎 억만을 헤어\n그 열매 만민이 산다\n고요한 아침의 나라\n일꾼을 부른다\n하늘 씨앗이 되어\n역사의 생명을 이어가리\nVerse 3 \n맑은 샘줄기 용솟아\n거칠은 땅에 흘러적실 때\n기름진 푸른 벌판이\n눈 앞에 활짝 트인다\n고요한 아침의 나라\n새 하늘 새 땅아\n길이 꺼지지 않는\n인류의 횃불되어 타거라\n아멘"}, {"title": "두손들고", "lyrics": "Verse 1\n두 손 들고 \n찬양 합니다\n다시 오실 왕 여호와께 \n오직 주만이 나를 다스리네 \nChorus\n나 주님만을 섬기리\n헛된 마음 버리고\n성령이여 내 영혼 \n충만하게 하소서\n주님 앞에 \n내 생명 드리리라"}, {"title": "내 삶 드리리", "lyrics": "Verse 1\n소망 없는 내 삶에\n새 생명 허락하신\n날 향한 주님의 은혜\n놀라운 주님의 사랑\n나 찬양하네\nVerse 2\n삶의 문제 힘겨워\n눈물만 드릴때도\n날 안아주시는 주님\n한 없는 주님의 사랑\n나 찬양하네\nChorus\n나의 믿음 주께 드려\n나의 삶이 주를 향해\n내 유일한 사랑 되신 주께\n내 삶 드리리\n나의 믿음 주께 드려\n나의 삶이 주를 향해\n내 유일한 사랑 되신 주께\n내 삶 드리리\nTag\n내 유일한 사랑 되신 주께\n내 삶 드리리"}, {"title": "주가 주되심을", "lyrics": "Verse \n내 손에 들려있는 \n지팡이 사용하셔서\n주님만이 주되심을 \n나타내소서\n맡겨주신 사명을 \n감당할 힘을 주시고\n주 이름만 높이게 하소서\n완악한 세상에서 \n믿음을 지키는 자로\n선하신 주 의지하여 \n살게 하소서\n거룩한 백성으로 \n구별된 주의 자녀로 \n주 이름만 따르게 하소서\nChorus \n나의 하나님 그는 여호와 \n유일하신 이름 \n그 위대하심 찬양해 \n세상 속에서 구별된 자로 \n주가 주되심을 나 선포하리라"}, {"title": "위대하신 주", "lyrics": "Title 1\n위대하신 주\nV\n빛나는 왕의 왕 영광의 주님\n온 땅 기뻐하라 온 땅 기뻐하라\n광채의 옷 입고 어두움 물리쳐\n저 원수는 떠네 저 원수는 떠네\nV\n영원한 주의 주 시간의 주관자\n알파와 오메가 알파와 오메가\n삼위의 하나님 아바 성령 예수\n사자와 어린 양 사자와 어린 양\nC\n위대하신 주 찬양해 위대하신 주\n모두 알게 되리라 위대하신 주\nB\n모든 이름 위에 뛰어나신 이름\n다 찬양해 위대하신 주"}, {"title": "주와 같이 길 가는것", "lyrics": "Verse1\n주와 같이 길 가는 것  \n즐거운 일 아닌가\n우리 주님 걸어가신\n발자취를 밟겠네\nVerse2\n어린 아이 같은 우리\n미련하고 약하나\n주의 손에 이끌리어\n생명 길로 가겠네\nVerse3\n꽃이 피는 들판이나\n험한 골짜기라도\n주가 인도 하는대로\n주와 같이 가겠네\nChorus \n날마다 주님 따라가리\n한걸음씩 또 한걸음씩\n \n주님 나와 영원히 함께하시니\n기쁨으로 걸어가리\nBridge \n한걸음 한걸음 \n주 예수와 함께\n날마다 날마다 \n우리는 걷겠네"}, {"title": "내 주는 구원의 주", "lyrics": "Title\n내 주는 구원의 주 \nVerse 1\n모든 이들 필요해 완전한 주 사랑 \n자비 베푸소서 \n모든 이들 필요해 구세주의 온유함  \n열방의 소망\nChorus\n예수 산을 옮기시는 \n내 주는 능력의 주 그는 구원의 주 \n영원한 구원의 창조자\n사망을 이기시고 예수 부활했네\nVerse 2\n내 실패와 두려움 주 받아주소서\n날 채우소서\n내 삶을 주께 드려 온전히 주 따르리\n주께 순종해\nBridge\n비추소서 주님의 빛을 찬양해 \n다시 사신 왕의 영광을 예수\n비추소서 주님의 빛을 찬양해 \n다시 사신 왕의 영광을"}, {"title": "찬송가 285장 - 주의 말씀 받은 그날", "lyrics": "Verse 1\n주의 말씀 받은 그 날 \n참 기쁘고 복 되도다\n이 기쁜 맘 못 이겨서 \n온 세상에 전하노라\nChorus\n기쁜 날 기쁜 날 \n주 나의 죄 다 씻은 날\n늘 깨어서 기도하고 \n늘 기쁘게 살아가리\n기쁜 날 기쁜 날 \n주 나의 죄 다 씻은 날\nVerse 2\n이 좋은 날 내 천한 몸 \n새 사람이 되었으니\n이 몸과 맘 다 바쳐서\n영광의 주 늘 섬기리\nVerse 3\n새 사람 된 그 날부터 \n평안한 맘 늘 있어서\n이 복된 말 전하는 일 \n나의 본분 삼았도다"}, {"title": "찬송가 314장-내 구주 예수를 더욱 사랑", "lyrics": "Verse 4\n&#xA;\n찬송가 314장\n&#xA;\n 내 구주 예수를 더욱 사랑\n&#xA;\n&#xA;\nVerse 1\n내 구주 예수를 더욱 사랑\n엎드려 비는 말 들으소서\n내 진정 소원이 내 구주 예수를\n더욱 사랑 더욱 사랑\nVerse 2\n이전엔 세상 낙 기뻤어도\n지금 내 기쁨은 오직 예수\n다만 내 비는 말 내 구주 예수를\n더욱 사랑 더욱 사랑\nVerse 3\n이 세상 떠날 때 찬양하고\n숨질 때 하는 말 이것일세\n다만 내 비는 말 내 구주 예수를\n더욱 사랑 더욱 사랑"}, {"title": "주님의 영광 나타나셨네", "lyrics": "Verse\n주님의 영광 나타나셨네\n권능으로 임하셨네\n죽음에서 날 살리신 주 성령\n놀라우신 주 하나님\nPre Chorus\n할렐루야 주의 나라가\n눈먼자는 눈을 뜨며\n할렐루야 임하소서\n저는자는 걷게되리\nChorus\n나는 선포하리 만왕의 왕 예수\n주의 나라 임하시네\nTag \n주의 나라 임하시네"}, {"title": "다 듣고 계신 나의 주님께", "lyrics": "Verse 1\n보이지 않는 길을 걷는 듯이\n막막한 세상을 홀로 버텨내고 있어\n들리지 않는 답을 찾는 듯이\n지친 그 마음에 그저 울 수밖에 없던 내가\nVerse 2\n머뭇거리는 나를 이끄시고\n힘겨운 하루를 그가 견디게 하시네\n나의 생각에 흔들리지 않고\n날 안아주시는 주님 한분만을 예배하네\nChorus\n여호와께 엎드려 나\n내 주님께 기도하면\n그는 날 안고 등을 다독여\n나의 눈물을 거두어 주시네\n우리곁에 임재하신\n내 주님께 노래하리\n미약하고 떨리는 소리지만\n다 듣고계신 나의 주님께\nBridge\n내 모든 아픔을 다 듣고계시는\n주 바라보네\n이제 나 일어나 세상을 이기신\n주 선포하네 주 선포하네\nTag\n나의 주님께"}, {"title": "호산나", "lyrics": "Verse 1\n찬양 중에 눈을 들어 주를 \nPraise is rising, eyes are turning to You,\n주를 보네\nwe turn to You\n소망 중에 마음 다해 주만 \nHope is stirring, hearts are yearning for You,\n나 바라네\nwe long for You\nPre-chorus\n주님을 볼 때 나에게 \n'Cause when we see You, we find strength\n힘 주시네\nto face the day\n주님 안에 모든 두려움 사라져 \nIn Your Presence all our fears are washed away,\n사라져\nwashed away\nChorus\n호산나 호산나\nHosanna, hosanna\n구원의 주 하나님\nYou are the God Who saves us, \n찬양 받으실 주님\nworthy of all our praises\n호산나 호산나\nHosanna, hosanna\n내 안에 임하셔서 \nCome have Your way among us\n주님의 뜻 이루소서\nWe welcome You here, Lord Jesus\nVerse 2\n주께 드린 마음 다한 기도 \nHear the sound of hearts returning to You, \n들으소서\nwe turn to You\n주의 나라 상한 영혼들을 \nIn Your Kingdom broken lives are made new,\n새롭게 해\nYou make us new\nHosanna, hosanna\nHosanna, hosanna"}, {"title": "모든 이들 필요해", "lyrics": "Verse 1\n모든 이들 필요해 \nEveryone needs compassion\n완전한 주 사랑 \nLove that's never failing\n자비 베푸소서 \nLet mercy fall on me\n모든 이들 필요해 \nEveryone needs forgiveness\n구세주의 온유함  \nThe kindness of a Savior\n열방의 소망\nThe hope of nations\nChorus\n예수 산을 옮기시는\nSavior, He can move the mountains\n내 주는 능력의 주 \nMy God is mighty to save,\n그는 구원의 주 \nHe is mighty to save\n영원한 구원의 창조자\nForever, Author of Salvation\n사망을 이기시고 \nHe rose and conquered the grave\n예수 부활했네\nJesus conquered the grave\nVerse 2\n내 실패와 두려움 \nSo take me as You find me\n주 받아주소서\nAll my fears and failures\n날 채우소서\nFill my life again\n내 삶을 주께 드려 \nI give my life to follow\n온전히 주 따르리\nEverything I believe in\n주께 순종해\nNow I surrender\nBridge\n비추소서 주님의 빛을 찬양해 \nShine your light and \nlet the whole world see, we're singing\n다시 사신 왕의 영광을 예수\nfor the glory of the risen King, Jesus\n비추소서 주님의 빛을 찬양해 \nShine your light and \nlet the whole world see, we're singing\n다시 사신 왕의 영광을 \nfor the glory of the risen King"}, {"title": "설후찬", "lyrics": "Verse 1\n모든 이들 필요해 \nEveryone needs compassion\n완전한 주 사랑 \nLove that's never failing\n자비 베푸소서 \nLet mercy fall on me\n모든 이들 필요해 \nEveryone needs forgiveness\n구세주의 온유함  \nThe kindness of a Savior\n열방의 소망\nThe hope of nations\nChorus\n예수 산을 옮기시는\nSavior, He can move the mountains\n내 주는 능력의 주 \nMy God is mighty to save,\n그는 구원의 주 \nHe is mighty to save\n영원한 구원의 창조자\nForever, Author of Salvation\n사망을 이기시고 \nHe rose and conquered the grave\n예수 부활했네\nJesus conquered the grave\nVerse 2\n내 실패와 두려움 \nSo take me as You find me\n주 받아주소서\nAll my fears and failures\n날 채우소서\nFill my life again\n내 삶을 주께 드려 \nI give my life to follow\n온전히 주 따르리\nEverything I believe in\n주께 순종해\nNow I surrender\nBridge\n비추소서 주님의 빛을 찬양해 \nShine your light and let the whole world see\n다시 사신 왕의 영광을 예수\nWe're singing for the glory of the risen King, Jesus\n비추소서 주님의 빛을 찬양해 \nShine your light and let the whole world see\n다시 사신 왕의 영광을 \nWe're singing for the glory of the risen King"}, {"title": "나의 믿음 주께 있네", "lyrics": "Chorus 1\n나의 믿음 \n주께 있네\n십자가 능력이 \n내 영광되었네\n주께서 우리를 \n승리케 하셨네\n나의 능력 나의 소망 \n주께 있네\nChorus 2\n오직 예수\n나의 믿음\n십자가 능력 속에\n빛나는 영광\n내 모든 승리로\n주님께 영광을\n나의 능력 나의 소망 \n주께 있네\nTag\nIn Christ alone, \nI place my trust\nAnd find my glory in \nthe power of the cross\nIn every victory, \nlet it be said of me\nMy source of strength, \nmy source of hope\nis Christ alone"}, {"title": "말씀으로 우리 길", "lyrics": "Verse\n말씀으로 우리 길 비추신 주\n우리 삶에 참 소망이 되시어\n모든 문제를 지나 승리로 우리를\n주 사랑으로 이끌어주시네\nChorus\n주님의 말씀이 우리의\n모든 맘과 영혼을 정케하시네\n영원한 삶으로 우릴 초대하시니\n주의 그 뜻 따라 영원히 살아가리"}, {"title": "오직 주", "lyrics": "Verse 1\n내 모습 연약할 때\n주 은혜 감싸네\n연약한 나를\n최고로 세우시네\nInterlude\nOh Oh Oh Oh\nOh Oh Oh Oh\nVerse 2\n내 영혼 충만하고\n내 마음 감동해\n연약한 나를\n최고로 세우시네\nVerse 3\n나의 미래 주 손에\n내 꿈을 찾았네\n주 없인 나의 삶에\n의미가 없네\nVerse 4\n주 내게 생명 주고\n내 삶을 비추네\n세상 모든 영광\n드리리 주님께\nPre Chorus\n주님의 나라\n곧 오리라\n내 모든 것 드리네\n이 세상 그 무엇보다 오직 주\nPre Chorus 2\n주님의 나라\n주님의 나라\nChorus\n지금 내 안에 계신 주\n주의 빛 세상 보도록\n약한 내 모습 사라져\n주 하나님\n결박을 끊으신 주\n빛 되신 주께\n모든 것 외치네 오직 주\nTag\nOh Oh Oh\nOh Oh Oh Oh"}, {"title": "내 안의 중심이 주를 찬양", "lyrics": "Verse 1 \n나 실패 거듭해 다시 넘어져도\n주 자비와 은혜로 날 안아주시네\n변함 없는 주님의 빛 비추시네\n영원하신 주 영광 온 땅 가득해\nVerse 2\n내 삶의 소망은 주 뜻 구하며\n나 자신을 버리고 주님을 찬양\n변함 없는 주님의 빛 비추시네\n영원하신 주 영광 온 땅 가득해\nPre Chorus\n내 맘과 영혼 모두 드리리\n성령의 불로 태우소서\n주님의 의로 날 감싸소서\n주를 더 사랑하도록\nChorus\n변함없는 주님의 빛 비추시네\n영원하신 주 영광 온 땅 가득해\n내 맘의 소망은 주님을 찬양\n내 안의 중심이 주를 찬양"}, {"title": "내 주의 보혈은", "lyrics": "Title\nVerse 1\n내 주의 보혈은 정하고 정하다 \n내 죄를 정케 하신 주 날 오라하신다\nVerse 2\n약하고 추해도 주께로 나가면 \n힘 주시고 내 추함을 곧 씻어 주시네\nVerse 3\n날 오라하심은 온전한 믿음과\n또 사랑함과 평안함 다 얻게 함일세\nVerse 4\n큰 죄인 복받아 빌길을 얻었네\n한없이 넓고 큰 은혜 베풀어 주소서\nVerse 5\n그 피가 맘속에 큰 증거됩니다\n내 기도소리 들으사 다 허락하소서\nChorus\n내가 주께로 지금 가오니\n골고다의 보혈로 날 씻어 주소서\nTag\n골고다의 보혈로 날 씻어 주소서"}, {"title": "나 같은 죄인 살리신", "lyrics": "Title\nVerse1\n나 같은 죄인 살리신 \n주 은혜 놀라워\n잃었던 생명 찾았고 \n광명을 얻었네\nVerse2\n큰 죄악에서 건지신\n주 은혜 고마워\n나 처음 믿은 그 시간 \n귀하고 귀하다\nChorus 1\n나의 결박 푸셨도다\n나의 구세주 대속했네\n넘쳐나는 주의 자비\n주의 사랑 주의 은혜\n&#xA;\nChorus 2 \n존귀한 이름 예수 \n찬양 받기에 합당한 이름\nChorus 3\nWorthy is your name, Jesus \nYou deserve the praise \nWorthy is your name\nVerse3\n이제껏 내가 산 것도 \n주님의 은혜라\n또 나를 장차 본향에 \n인도해주시리\nVerse4\n거기서 우리 영원히 \n주님의 은혜로 \n해처럼 밝게 살면서 \n주 찬양 하리라"}, {"title": "나 같은 죄인 살리신", "lyrics": "Title\nVerse1\n나 같은 죄인 살리신 \n주 은혜 놀라워\n잃었던 생명 찾았고 \n광명을 얻었네\nVerse2\n큰 죄악에서 건지신\n주 은혜 고마워\n나 처음 믿은 그 시간 \n귀하고 귀하다\nChorus 1\n나의 결박 푸셨도다\n나의 구세주 대속했네\n넘쳐나는 주의 자비\n주의 사랑 주의 은혜\n&#xA;\nChorus 2 \n존귀한 이름 예수 찬양 받기에\n합당한 이름\nChorus 3\nWorthy is your name, Jesus \nYou deserve the praise \nWorthy is your name\nVerse3\n이제껏 내가 산 것도 \n주님의 은혜라\n또 나를 장차 본향에 \n인도해 주시리\nVerse 4\n거기서 우리 영원히 \n주님의 은혜로 \n해처럼 밝게 살면서 \n주 찬양 하리라"}, {"title": "나 같은 죄인 살리신", "lyrics": "Verse1\n나 같은 죄인 살리신 \n주 은혜 놀라워\n잃었던 생명 찾았고 \n광명을 얻었네\nVerse2\n큰 죄악에서 건지신\n주 은혜 고마워\n나 처음 믿은 그 시간 \n귀하고 귀하다\nChorus 1\n나의 결박 푸셨도다\n나의 구세주 대속했네\n넘쳐나는 주의 자비\n주의 사랑 주의 은혜\n&#xA;\nChorus 2 \n존귀한 이름 예수 찬양 받기에\n합당한 이름\nChorus 3\nWorthy is your name, Jesus \nYou deserve the praise \nWorthy is your name\nVerse3\n이제껏 내가 산 것도 \n주님의 은혜라\n또 나를 장차 본향에 \n인도해주시리\nVerse4\n거기서 우리 영원히 \n주님의 은혜로 \n해처럼 밝게 살면서 \n주 찬양 하리라"}, {"title": "주 안에서 기뻐해", "lyrics": "Title\n주 안에서 기뻐해\nVerse\n주 안에서 기뻐해 주 안에서 기뻐해\n주님 주신 기쁨으로 기뻐하라\n주 안에서 기뻐해 주 안에서 기뻐해\n우리의 힘은 주를 기뻐 하는 것\nChorus\n기뻐 춤을 추며 크게 소리 높여\n살아계신 주의 이름 내 마음 다해 찬양해\n주를 바라 볼 때 새 힘 주시리\n우리의 힘은 주를 기뻐 하는 것\nBridge\n무화과 나무 마르고 \n포도 열매 없어도\n주님 늘 함께 하시니 \n나는 기뻐하고 즐거워 하리로다"}, {"title": "기뻐하며 승리의 노래", "lyrics": "Title\n기뻐하며 승리의 노래\nVerse\n기뻐하며 승리의 노래 부르리\n그 백성 주가 회복시키시네\n그 사랑으로 억눌렸던 자 모아\n칭찬과 명성 얻게 하시네\nPre Chorus\n전심으로 기뻐하리 \n전능의 왕 함께 하시네\nChorus\n기뻐 외치며 주께 두 손 들리\n춤을 추며 왕께 찬양해\n모든 원수를 멸하신 주님\n전능의 왕 함께 하시네\nTag\n전능의 왕 함께 하시네"}, {"title": "하나님의 사랑", "lyrics": "Verse 1\n하나님 사랑은\n온전한 참 사랑\n내 맘에 부어 주시사\n충만케 하소서\nVerse 2\n내 주님 참 사랑\n햇빛과 같으니\n그 사랑 내게 비추사\n뜨겁게 하소서\nVerse 3\n그 사랑 앞에는\n풍파도 그치며\n어두운 밤도 환하니\n그 힘이 크도다\nVerse 4\n하나님 사랑은\n온전한 참 사랑\n내 맘과 영에 채우사\n새 힘을 주소서"}, {"title": "빈들의 마른 풀 같이", "lyrics": "Title\n하늘 문 여소서 (빈 들의 마른 풀 같이)\nVerse 1\n빈 들에 마른 풀 같이\n시들은 나의 영혼\n주님의 허락한 성령\n간절히 기다리네\nVerse 2\n반가운 빗소리 들려\n산천이 춤을 추네\n봄비로 내리는 성령\n내게도 주옵  아멘"}, {"title": "내 모든 삶의 행동/승리하였네", "lyrics": "Verse\n내 모든 삶의 행동 주 안에\n주님 안에 있네 \n나의 숨쉬는 순간들도\n내 모든 삶의 걸음 주 안에\n내 길도 주 안에 \n나의 숨쉬는 순간들도\nPre Chorus\n라 라라 라라 라라\n라 라라 라라 라라\n라 라라 라라 라라\n라 라라 라라 라라\nPre Chorus\nSigning 라 라라 라라 라라\n라 라라 라라 라라\n라 라라 라라 라라\n라 라라 라라 라라\nChorus 1 \n자비와 은혜의 물결\n어디서나 주 얼굴 보네\n주 사랑 날 붙드네\n오 놀라운 주님의 사랑\nChorus 2 \n승리하였네 어린 양의 보혈로\n우린 보혈의 능력으로 서리라\n승리하였네 어린 양의 보혈로\n주 내게 승리주셨네"}, {"title": "아버지의 사랑", "lyrics": "Verse\n나의 모든 순간 늘 함께 하셨네\n언제나 나를 귀히 여기시네\n자격 없을 때도 날 사랑하셨네\n언제나 나를 기뻐하시네\nChorus\n끝이 없는 아버지의 사랑\n작은 나는 이해할 수 없네\nBridge\n완전하신 주의 은혜 측량할 수 없네\n찬양합니다 영원토록\nBridge 2\n나를 살리신 그 사랑 나를 건지신 그 은혜\n어떤 것도 그 사랑에서 끊을 수 없으리"}, {"title": "Great Are You Lord", "lyrics": "Verse\nYou give life, You are love, \nYou bring light to the darkness\nYou give hope, You restore,\nEvery heart that is broken\nGreat are You, Lord\nChorus\nIt's Your breath in our lungs \nSo we pour out our praise, \nWe pour out our praise\nIt's Your breath in our lungs\nSo we pour out our praise to You only\nBridge\nAll the earth will shout Your praise\nOur hearts will cry, these bones will sing\nGreat are You, Lord"}, {"title": "주님의 마음을 본받는 자", "lyrics": "Verse 1\n주님의 마음을 본받는 자\n그 맘에 평강이 찾아 옴은\n험악한 세상을 이길 힘이\n하늘로부터 임함이로다\nVerse 2\n주 모습 내 눈에 안 보이며\n그 음성 내 귀에 안 들려도\n내 영혼 날마다 주를 만나\n신령한 말씀 늘 배우도다\nVerse 3\n가는 길 거칠고 험하여도\n내 맘에 불평이 없어짐은\n십자가 고난을 이겨내신\n주님의 마음 본받음이라\nVerse 4\n주 예수 세상에 다시 오실\n그 날엔 뭇 성도 변화하여\n주님의 빛나는 그 형상을\n다 함께 보며 주 찬양하리\nChorus\n주님의 마음 본받아 살면서\n그 거룩하심 나도 이루리"}, {"title": "밀알", "lyrics": "Verse 1\n세상을 구원하기 위해 \n흘려야할 피가 필요하다면 \n죄인을 대신하기 위해 \n희생의 제물 필요하시다면 \n내 생명 제단위에 드리니\n주 영광 위해 사용하소서 \nVerse 2\n길 잃어 지친 양을 찾아 \n마음 상해 이리 저리 헤메이는 \n한 영혼 찾아 아파 하는 \n예수님 마음 내게 주옵소서 \n십자가 온 세상 위한 그 희생 \n눈물로 그길 가게 하소서 \nChorus\n생명이 또 다른 생명 낳고 \n주님 볼 수 있다면 \n나의 삶과 죽음도 \n아낌없이 드리리 \n죽어야 다시 사는 \n주의 말씀 믿으며\n \n한 알의 밀알 되어 \n썩어 지리니 \n예수님처럼 살아가게 하소서 \nTag\n예수님처럼 살아가게 하소서"}, {"title": "주만 내 상급", "lyrics": "Verse\n주 발 앞에 \n엎드리네\n존귀하신 \n주 여기 계시네\n아름다운 \n주의 음성\n내게 들려오네 \n나를 고치시네\nChorus\n주만 내 상급 \n주만 내 기쁨\n다만 나는 믿음으로 \n주의 영광 보리라"}, {"title": "빛 되신 주", "lyrics": ""}, {"title": "빛 되신 주", "lyrics": "Verse 1 \n빛 되신 주 \n어둠 가운데 비추사 \n내 눈 보게 하소서 \n예배하는 선한 마음 주시고\n산 소망이 되시네 \nVerse 2\n만유의 높임을 받으소서\n영광 중에 계신 주 \n겸손하게 이 땅에 임하신 주 \n높여 찬양하리라 \nChorus \n나 주를 경배하리\n엎드려 절하며 \n고백해 주 나의 하나님\n오 사랑스런 주님\n존귀한 예수님\n아름답고 놀라우신 주\nBridge\n다 알 수 없네 주의 은혜 \n내 죄 위한 주 십자가"}, {"title": "설후찬", "lyrics": "Verse\n하나님의 빛 앞에서 \n그 투명한 빛 앞에서\n모두 드러날 나의 모든 죄와 허물 \n하나님의 빛 속에서 \n그 따뜻한 빛 속에서 \n모두 고쳐질 나의 모든 죄와 상처 \n그의 빛 속에서\nChorus\n드러내어 징계함 아닌 \n드러내어 고치시는 \n하나님의 은혜와 사랑 \n하나님의 빛\n드러내어 부끄럽게 하지않고 \n더욱 단단히 만들\n은혜와 사랑 전하게 할 \n하나님 그 빛"}, {"title": "하나님의 빛", "lyrics": "Verse\n하나님의 빛 앞에서 \n그 투명한 빛 앞에서\n모두 드러날 나의 모든 죄와 허물 \n하나님의 빛 속에서 \n그 따뜻한 빛 속에서 \n모두 고쳐질 나의 모든 죄와 상처 \n그의 빛 속에서\nChorus\n드러내어 징계함 아닌 \n드러내어 고치시는 \n하나님의 은혜와 사랑 \n하나님의 빛\n드러내어 부끄럽게 하지않고 \n더욱 단단히 만들\n은혜와 사랑 전하게 할 \n하나님 그 빛"}, {"title": "소망 없고 빛도 없는", "lyrics": "Verse 1\n소망 없고 빛도 없는 어두운 세상을 \n하나님이 사랑하사 우리에게 오셨네\nVerse 2\nVerse 3\nVerse 4\nChorus"}, {"title": "지극히 높으신 주", "lyrics": ""}, {"title": "지극히 높으신 주", "lyrics": "Verse 1\n소망 없고 빛도 없는 \n어두운 세상을\n하나님이 사랑하사 \n우리에게 오셨네\n예언하신 약속대로 \n말씀이 육신 되어\n하늘 영광 버리시고 \n이 땅으로 오셨네\nVerse 2\n주가 지으신 모든 \n세상을 구원하려\n영광의 주 \n예수님이 죽음을 택하셨네\n그 고통 속에서도 \n주의 뜻 기억하사\n길을 잃은 우릴 위해 \n십자가를 지셨네\nVerse 3\n부활하신 그 아침 \n닫힌 무덤 열리고\n죽임당한 어린 양 \n죽음을 이기셨네\n생명의 길 되시는 \n그리스도를 통해\n아버지께 오는 자 \n모두 회복되리라\nVerse 4\n주가 세우신 교회 \n성령이 이끄시네\n영원한 주의 복음 \n무너지지 않으리\n주의 보혈로 인해 \n나는 자유케 됐네\n예수의 사랑으로 \n새 생명을 얻었네\nChorus\n찬양하세 우리 주 \n삼위일체 하나님\n지극히 높으신 주 \n영원토록 찬양합니다"}, {"title": "내 기도하는 그 시간", "lyrics": "Verse 1\n내 기도하는 그 시간 \n그 때가 가장 즐겁다\n이 세상 근심 걱정에 \n얽매인 나를 부르사\n내 진정 소원 주앞에\n낱낱이 바로 아뢰어\n큰 불행 당해 슬플 때\n나 위로 받게 하시네\nVerse 2\n내 기도하는 그 시간\n내게는 가장 귀하다\n저 광야 같은 세상을\n끝없이 방황 하면서\n위태한 길로 나갈때\n주께서 나를 이끌어\n그 보좌 앞에 나아가\n큰 은혜 받게 하시네\nVerse 3\n내 기도하는 그 시간\n그 때가 가장 즐겁다\n이때껏 지은 큰 죄로\n내 마음 심히 아파도\n참 마음으로 뉘우쳐 \n다 숨김없이 아뢰면\n주 나를 위해 복 주사 \n새 은혜 부어 주시네\nVerse 4\n내 기도하는 그 시간\n그 때가 가장 즐겁다\n주 세상에서 일찍이 \n저 요란한 곳 피하여\n빈 들에서나 산에서 \n온 밤을 새워 지내사\n주 예수 친히 기도로 \n큰 본을 보여 주셨네\n아멘"}, {"title": "다시 밤이 없겠고", "lyrics": "Verse \n오늘 우리 삶에 \n주의 일 행하시네\n실수가 없으신 \n완벽한 일하심으로 \n마침내 그날에 \n주 약속 이루시네 \n천지를 지으신 \n온전한 그 말씀으로 \nChorus \n다시 밤이 없겠고 \n햇빛도 쓸데없으리 \n하나님이 우리의 \n영원한 빛 되시네 \n다시 눈물 없겠고 \n슬픔과 고통 없으리\n하나님과 우리가 \n영원히 함께 사네"}, {"title": "왕 되신 주", "lyrics": "Verse 1\n왕 되신 주 \n다 찬양하여라\n영광과 존귀 \n주께 돌리세\n하늘 위에 \n높이 계신 주님\n주님의 말씀 \n존귀하도다\nVerse 2\n소망의 주 \n다 찬양하여라\n휘장을 걷고 \n보좌 오르사\n우리 위해 \n중보 되신 주님\n날마다 은혜 \n부어 주신다\nVerse 3\n거룩한 주 \n다 경배하여라\n선하신 주께 \n다 찬양하라\n천사들도 \n다 경배하여라\n구세주 예수 \n영원하도다\n아멘"}, {"title": "예수 주 승리하심 찬양", "lyrics": ""}, {"title": "예수 주 승리하심", "lyrics": "Verse\n예수 주 승리하심 찬양해\n예수 주 사랑 놀라와\n예수 자유 주심 기뻐해\n예수 생명을 주셨네\nVerse 2\n예수 주 승리하심 찬양해\n예수 주 사랑 놀라와\n예수! 자유 주심 기뻐해\n예수 생명을 주셨네\nChorus 1\n구원의 주님 자유케 하셨네\n모든 죄의 멍에를 주가 깨뜨리셨네\n우리 기뻐해 \n승리의 주님\n우리 마음 \n주께 향하네\nTag\n예수 생명을 주셨네\nChorus 2\n주님의 성령 내 안에 계시니\n담대히 주께 나갈 담력을 얻었네\n주 임재 안에서 \n문제는 사라져\n우리 맘 주께 향하네"}, {"title": "예수 주 승리하심 찬양해", "lyrics": ""}, {"title": "나의 생명 드리니", "lyrics": "Verse 1\n나의 생명 드리니 \n주여 받아주셔서\n세상 살아갈 동안 \n찬송하게 하소서\nVerse 2\n손과 발을 드리니 \n주여 받아주셔서\n주의 일을 위하여 \n민첩하게하소서\nVerse 3\n나의 음성 드리니 \n주여 받아주셔서\n주의 진리 말씀만 \n전파하게 하소서\nVerse 4\n나의 보화 드리니 \n주여 받아주셔서\n하늘나라 위하여 \n주 뜻대로 쓰소서\nVerse 5\n나의 시간 드리니 \n주여 받아주셔서\n평생토록 주 위해 \n봉사하게 하소서 \n아멘"}, {"title": "찬송가 259", "lyrics": "Verse 1\n예수 십자가에 흘린 피로써\n그대는 씻기어 있는가\n더러운 죄 희게하는 능력을\n그대는 참 의지 하는가\nVerse 2\n주 예수와 밤낮으로 늘 함께\n그대는 행동을 하는가\n아무 때나 어디서나 그대는\n십자가 붙들고 있는가\nVerse 3\n주님 예수 다시 올 때 그대는\n영접할 예복이 있는가\n그대 몸은 거룩한 곳 천국에\n들어갈 준비가 됐는가\nVerse 4 \n모든 죄에 더러워진 예복을 \n주 앞에 지금 다 벗어서\n샘물같이 솟아나는 보혈로\n눈보다 더 희게 씻으라\nChorus\n예수의 보혈로\n그대는 씻기어 있는가\n마음 속의 여러 가지 죄악이\n깨끗이 씻기어 있는가"}, {"title": "Holy Forever", "lyrics": "Verse 1\n&#xA;\nA thousand generations\nfalling down in worship\nTo sing the song of ages\nto the Lamb\nAnd all who've gone before us \nand all who will believe\nWill sing the song of ages \nto the Lamb\nPre-Chorus\nYour name is the highest\nYour name is the greatest\nYour name stands \nabove them all\nAll thrones and dominions\nAll powers and positions\nYour name stands // ===== 탭 전환 =====
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', (i===0 && tab==='search') || (i===1 && tab==='new'));
  });
  document.getElementById('tab-search').classList.toggle('active', tab==='search');
  document.getElementById('tab-new').classList.toggle('active', tab==='new');
}

// ===== 검색 탭 =====
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  doSearch();
}

function highlight(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(escaped, 'gi'), m => `<mark>${m}</mark>`);
}

function doSearch() {
  const q = searchQuery.trim().toLowerCase();
  filtered = q
    ? SONGS.filter(s => {
        if (currentMode === 'title') return s.title.toLowerCase().includes(q);
        if (currentMode === 'lyrics') return s.lyrics.toLowerCase().includes(q);
        return s.title.toLowerCase().includes(q) || s.lyrics.toLowerCase().includes(q);
      })
    : [...SONGS];
  renderList(q);
}

  const list = document.getElementById('songList');
  const info = document.getElementById('resultInfo');
  info.textContent = q ? `"${q}" 검색 결과 ${filtered.length}곡` : `전체 ${filtered.length}곡`;
  if (filtered.length === 0) { list.innerHTML = '<div class="no-results">검색 결과가 없어요</div>'; return; }
  list.innerHTML = filtered.map((s, i) => {
    const isActive = currentSong && currentSong.title === s.title && currentSong.lyrics === s.lyrics;
    const previewText = s.lyrics.replace(/\n/g, ' ').slice(0, 55);
    return `<div class="song-item ${isActive ? 'active' : ''}" onclick="selectSong(${i})">
      <div class="song-title">${highlight(s.title, q)}</div>
      <div class="song-preview">${(currentMode==='lyrics'||currentMode==='all') ? highlight(previewText,q) : previewText}</div>
    </div>`;
  }).join('');
}

function selectSong(idx) {
  currentSong = filtered[idx];
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('lyricsContent').style.display = 'block';
  document.getElementById('loadBtn').style.display = 'block';
  document.getElementById('lyricsTitle').textContent = currentSong.title;

  const lines = currentSong.lyrics.split('\n');
  let html = '';
  for (const line of lines) {
    const trimmed = line.trim();
    if (sectionPattern.test(trimmed)) html += `<span class="section-label">${trimmed}</span>`;
    else html += trimmed + '\n';
  }
  document.getElementById('lyricsBody').innerHTML = html;
  document.querySelectorAll('.song-item').forEach((el, i) => el.classList.toggle('active', i === idx));
}

function loadToEditor() {
  if (!currentSong) return;
  const lines = currentSong.lyrics.split('\n');
  let result = '';
  let buf = [];

  function flush() {
    if (!buf.length) return;
    for (let i = 0; i < buf.length; i += 2) result += buf.slice(i,i+2).join('\n') + '\n\n';
    buf = [];
  }

  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (sectionPattern.test(line)) { flush(); result += line + '\n'; }
    else if (line === '') flush();
    else buf.push(line);
  }
  flush();
  document.getElementById('editor').value = result.trimEnd();
}

function copyEditor() {
  const text = document.getElementById('editor').value;
  if (!text.trim()) return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ 복사됨';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 복사'; btn.classList.remove('copied'); }, 2000);
  });
}

function clearEditor() {
  if (document.getElementById('editor').value && confirm('편집 내용을 지울까요?')) document.getElementById('editor').value = '';
}

// ===== 새 찬양 탭 =====
function convertLyrics() {
  const raw = document.getElementById('pasteArea').value.trim();
  if (!raw) { alert('가사를 먼저 붙여넣어주세요.'); return; }

  // 빈 줄로 단락 분리 시도
  const byBlank = raw.split(/\n\s*\n/).map(b => b.trim()).filter(b => b.length > 0);

  let blocks;
  if (byBlank.length <= 1) {
    // 빈 줄이 없으면 4줄씩 자동 분리
    const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    blocks = [];
    for (let i = 0; i < lines.length; i += 4) {
      blocks.push(lines.slice(i, i + 4).join('\n'));
    }
  } else {
    blocks = byBlank;
  }

  segments = blocks.map((b, i) => ({ lines: b, label: '' }));
  renderSegments();
}

function renderSegments() {
  const area = document.getElementById('segmentsArea');
  if (segments.length === 0) {
    area.innerHTML = '<div class="empty-segments"><div style="font-size:28px;opacity:0.2;">🎼</div><div>왼쪽에 가사를 붙여넣고<br>단락 분석 버튼을 눌러주세요</div></div>';
    return;
  }

  area.innerHTML = segments.map((seg, i) => {
    const opts = LABEL_OPTIONS.map(l => `<option value="${l}" ${seg.label===l?'selected':''}>${l}</option>`).join('');
    const preview = seg.lines.split('\n').slice(0,2).join('\n');
    const displayText = seg.lines.replace(/</g,'&lt;');
    return `<div class="segment-card">
      <div class="segment-header">
        <span class="segment-label">단락 ${i+1}</span>
        <select class="label-select" onchange="setLabel(${i}, this.value)">
          <option value="">-- 레이블 선택 --</option>
          ${opts}
        </select>
      </div>
      <div class="segment-body">${displayText}</div>
    </div>`;
  }).join('');
}

function setLabel(idx, val) {
  segments[idx].label = val;
}

function resetSegments() {
  segments = [];
  document.getElementById('pasteArea').value = '';
  document.getElementById('newSongTitle').value = '';
  renderSegments();
}

function buildOutput() {
  const title = document.getElementById('newSongTitle').value.trim();
  let result = '';
  for (const seg of segments) {
    if (seg.label === '없음(제거)') continue;
    if (seg.label) result += seg.label + '\n';
    const lines = seg.lines.split('\n').filter(l => l.trim());
    for (let i = 0; i < lines.length; i += 2) {
      result += lines.slice(i, i+2).join('\n') + '\n\n';
    }
  }
  return result.trimEnd();
}

function exportToEditor() {
  const output = buildOutput();
  if (!output) { alert('레이블을 하나 이상 지정해주세요.'); return; }
  document.getElementById('editor').value = output;
  switchTab('search');
}

function copyNewSong() {
  const output = buildOutput();
  if (!output) { alert('레이블을 하나 이상 지정해주세요.'); return; }
  navigator.clipboard.writeText(output).then(() => {
    const btn = document.getElementById('copyNewBtn');
    btn.textContent = '✓ 복사됨';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 편집 내용 복사'; btn.classList.remove('copied'); }, 2000);
  });
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  doSearch();
});

renderList('');
</script>
