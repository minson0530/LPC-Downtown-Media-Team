<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LPC Downtown 찬양 가사</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4ef;
    --surface: #ffffff;
    --surface2: #f0ece4;
    --border: #e0d8cc;
    --gold: #8b6914;
    --gold2: #a07c1a;
    --gold-light: #f5ecd4;
    --text: #2a2218;
    --text-muted: #7a6e5e;
    --text-dim: #b0a898;
    --accent-bg: #fdf8f0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; overflow: hidden; }

  header {
    padding: 20px 32px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .header-top { display: flex; align-items: center; justify-content: space-between; }
  .header-text { display: flex; flex-direction: column; gap: 2px; }
  .church-name { font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 700; color: var(--gold); }
  .page-subtitle { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .song-count-badge { font-size: 12px; color: var(--text-muted); background: var(--surface2); border: 1px solid var(--border); padding: 4px 12px; border-radius: 20px; }

  /* 탭 */
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    padding: 0 32px;
  }

  .tab-btn {
    padding: 12px 24px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    margin-bottom: -1px;
  }

  .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); font-weight: 600; }
  .tab-btn:hover { color: var(--text); }

  /* 탭 콘텐츠 */
  .tab-content { display: none; height: calc(100vh - 168px); overflow: hidden; }
  .tab-content.active { display: flex; }

  /* ===== 검색 탭 ===== */
  .search-wrap { display: flex; gap: 10px; align-items: center; }
  .search-box { flex: 1; position: relative; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); pointer-events: none; font-size: 14px; }

  input[type="text"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px 11px 40px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  input[type="text"]::placeholder { color: var(--text-dim); }
  input[type="text"]:focus { border-color: var(--gold); background: var(--surface); }

  .search-mode { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .mode-btn { padding: 9px 16px; background: none; border: none; color: var(--text-muted); font-family: 'Noto Sans KR', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .mode-btn.active { background: var(--gold); color: #fff; font-weight: 600; }

  .search-tab-layout { display: grid; grid-template-columns: 300px 1fr 1fr; width: 100%; height: 100%; }

  .list-panel { border-right: 1px solid var(--border); overflow-y: auto; background: var(--surface); scrollbar-width: thin; scrollbar-color: var(--border) transparent; height: 100%; }
  .result-info { padding: 10px 16px; font-size: 11px; color: var(--text-dim); border-bottom: 1px solid var(--border); background: var(--accent-bg); position: sticky; top: 0; z-index: 1; }

  .song-item { padding: 13px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; display: flex; flex-direction: column; gap: 3px; }
  .song-item:hover { background: var(--accent-bg); }
  .song-item.active { background: var(--gold-light); border-left: 3px solid var(--gold); padding-left: 13px; }
  .song-title { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.4; }
  .song-preview { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  mark { background: #f5d87a; color: var(--text); border-radius: 2px; padding: 0 1px; }

  .lyrics-panel { border-right: 1px solid var(--border); overflow-y: auto; background: var(--surface); scrollbar-width: thin; scrollbar-color: var(--border) transparent; display: flex; flex-direction: column; }
  .panel-header { padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--accent-bg); position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; }
  .panel-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }

  .load-btn { padding: 6px 12px; background: var(--gold); color: #fff; border: none; border-radius: 5px; font-family: 'Noto Sans KR', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  .load-btn:hover { background: var(--gold2); }

  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-dim); gap: 10px; }
  .empty-icon { font-size: 32px; opacity: 0.3; }
  .empty-text { font-size: 13px; }

  .lyrics-content { padding: 28px; flex: 1; }
  .lyrics-title { font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 24px; line-height: 1.4; }
  .lyrics-body { font-size: 14px; line-height: 2.1; color: var(--text); white-space: pre-wrap; font-weight: 300; }
  .section-label { display: block; font-size: 9px; font-weight: 700; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-top: 22px; margin-bottom: 2px; opacity: 0.8; }

  .edit-panel { display: flex; flex-direction: column; background: var(--surface); }
  .edit-header { padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--accent-bg); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .edit-actions { display: flex; gap: 8px; }

  .btn { padding: 6px 14px; border-radius: 5px; border: none; font-family: 'Noto Sans KR', sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .btn-danger { background: none; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-danger:hover { color: #c0392b; border-color: #c0392b; }
  .btn-primary { background: var(--gold); color: #fff; font-weight: 600; }
  .btn-primary:hover { background: var(--gold2); }
  .btn-primary.copied { background: #27ae60; }

  .edit-hint { padding: 9px 20px; font-size: 11px; color: var(--text-muted); background: #fffdf7; border-bottom: 1px solid var(--border); line-height: 1.6; }

  textarea {
    flex: 1;
    background: var(--surface);
    border: none;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 300;
    line-height: 2.1;
    padding: 24px;
    resize: none;
    outline: none;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  textarea::placeholder { color: var(--text-dim); line-height: 2; }
  .no-results { padding: 32px 16px; text-align: center; color: var(--text-dim); font-size: 13px; }

  /* ===== 새 찬양 탭 ===== */
  .new-song-layout { display: grid; grid-template-columns: 1fr 1fr; width: 100%; gap: 0; height: 100%; }

  .new-left { display: flex; flex-direction: column; border-right: 1px solid var(--border); height: 100%; overflow: hidden; }
  .new-right { display: flex; flex-direction: column; height: 100%; overflow: hidden; }

  .new-left-header, .new-right-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--accent-bg);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .song-title-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    outline: none;
  }

  .song-title-input:focus { border-color: var(--gold); }
  .song-title-input::placeholder { color: var(--text-dim); }

  .paste-area {
    flex: 1;
    background: var(--surface);
    border: none;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 300;
    line-height: 2;
    padding: 24px;
    resize: none;
    outline: none;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .paste-area::placeholder { color: var(--text-dim); }

  .convert-bar {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    background: var(--accent-bg);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
  }

  .convert-hint { font-size: 11px; color: var(--text-dim); flex: 1; }

  /* 단락 편집기 */
  .segments-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    min-height: 0;
  }

  .segment-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    flex-shrink: 0;
  }

  .segment-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--accent-bg);
    border-bottom: 1px solid var(--border);
  }

  .segment-label { font-size: 11px; color: var(--text-muted); font-weight: 500; }

  select.label-select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 12px;
    color: var(--text);
    outline: none;
    cursor: pointer;
  }

  select.label-select:focus { border-color: var(--gold); }

  .segment-body {
    padding: 12px;
    font-size: 13px;
    line-height: 1.9;
    color: var(--text);
    white-space: pre-wrap;
    font-weight: 300;
    min-height: 24px;
  }

  .segment-empty { color: var(--text-dim); font-style: italic; font-size: 12px; }

  .new-right-bottom {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    background: var(--accent-bg);
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    flex-shrink: 0;
  }

  .empty-segments {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    gap: 8px;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="header-text">
      <div class="church-name">LPC Downtown</div>
      <div class="page-subtitle">미디어팀 찬양 가사 검색</div>
    </div>
    <span class="song-count-badge" id="totalCount"></span>
  </div>
</header>

<!-- 탭 -->
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('search')">🔍 가사 검색</button>
  <button class="tab-btn" onclick="switchTab('new')">✏️ 새 찬양 추가</button>
</div>

<!-- 검색 탭 -->
<div class="tab-content active" id="tab-search">
  <div class="search-tab-layout">
    <!-- 검색창은 탭 안에 -->
    <div style="grid-column: 1/-1; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 10px;">
      <div class="search-box" style="flex:1; position:relative;">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="찬양 제목 또는 가사로 검색..." autocomplete="off">
      </div>
      <div class="search-mode">
        <button class="mode-btn active" data-mode="title" onclick="setMode('title')">제목</button>
        <button class="mode-btn" data-mode="lyrics" onclick="setMode('lyrics')">가사</button>
        <button class="mode-btn" data-mode="all" onclick="setMode('all')">전체</button>
      </div>
    </div>

    <div class="list-panel" style="grid-column:1; grid-row:2;">
      <div class="result-info" id="resultInfo">전체 곡</div>
      <div id="songList"></div>
    </div>

    <div class="lyrics-panel" style="grid-column:2; grid-row:2;">
      <div class="panel-header">
        <span class="panel-label">가사 보기</span>
        <button class="load-btn" onclick="loadToEditor()" id="loadBtn" style="display:none">편집 패드로 불러오기 →</button>
      </div>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🎵</div>
        <div class="empty-text">왼쪽에서 곡을 선택하세요</div>
      </div>
      <div class="lyrics-content" id="lyricsContent" style="display:none">
        <div class="lyrics-title" id="lyricsTitle"></div>
        <div class="lyrics-body" id="lyricsBody"></div>
      </div>
    </div>

    <div class="edit-panel" style="grid-column:3; grid-row:2;">
      <div class="edit-header">
        <span class="panel-label">편집 패드</span>
        <div class="edit-actions">
          <button class="btn btn-danger" onclick="clearEditor()">지우기</button>
          <button class="btn btn-primary" id="copyBtn" onclick="copyEditor()">📋 복사</button>
        </div>
      </div>
      <div class="edit-hint">💡 빈 줄 = ProPresenter 슬라이드 구분 &nbsp;|&nbsp; Verse / Chorus 레이블은 슬라이드 제목으로 인식됨</div>
      <textarea id="editor" placeholder="왼쪽에서 곡을 선택하고&#10;'편집 패드로 불러오기'를 누르세요."></textarea>
    </div>
  </div>
</div>

<!-- 새 찬양 탭 -->
<div class="tab-content" id="tab-new">
  <div class="new-song-layout">

    <!-- 왼쪽: 붙여넣기 -->
    <div class="new-left">
      <div class="new-left-header">
        <span class="panel-label">가사 붙여넣기</span>
        <input type="text" class="song-title-input" id="newSongTitle" placeholder="곡 제목 입력...">
      </div>
      <textarea class="paste-area" id="pasteArea" placeholder="Bugs, 멜론 등에서 복사한 가사를 여기에 붙여넣으세요.&#10;&#10;빈 줄로 단락이 구분됩니다.&#10;&#10;예시)&#10;첫번째 줄&#10;두번째 줄&#10;세번째 줄&#10;&#10;네번째 줄&#10;다섯번째 줄"></textarea>
      <div class="convert-bar">
        <span class="convert-hint">붙여넣기 후 단락을 자동으로 감지해요</span>
        <button class="btn btn-primary" onclick="convertLyrics()">→ 단락 분석</button>
      </div>
    </div>

    <!-- 오른쪽: 단락별 레이블 지정 -->
    <div class="new-right">
      <div class="new-right-header">
        <span class="panel-label">단락별 레이블 지정</span>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-danger" onclick="resetSegments()">초기화</button>
          <button class="btn btn-primary" id="exportBtn" onclick="exportToEditor()">편집 패드로 보내기 →</button>
        </div>
      </div>

      <div class="segments-area" id="segmentsArea">
        <div class="empty-segments">
          <div style="font-size:28px; opacity:0.2;">🎼</div>
          <div>왼쪽에 가사를 붙여넣고<br>'단락 분석' 버튼을 눌러주세요</div>
        </div>
      </div>

      <div class="new-right-bottom">
        <button class="btn btn-primary" id="copyNewBtn" onclick="copyNewSong()">📋 편집 내용 복사</button>
      </div>
    </div>
  </div>
</div>

<script>

e 2\n완전하신 하나님이\n우리와 같이 되셨네\n주 사랑과 그 공의로\n세상을 구원하셨네\nChorus 2\n십자가에 주 달리사\n그 진노를 거두셨네\n내 모든 죄 담당하신\n주 은혜 안에 살리라\nVerse 3\n죽임당한 세상의 빛\n어둠 속에 누이셨네\n영광스런 그의 날에\n무덤에서 부활했네\nChorus 3\n승리하신 우리 주님\n원수들을 물리쳤네\n나 주의 것 주 나의 것\n주 보혈 안에 살리라\nVerse 4\n주 예수의 능력으로\n내 속에 두려움 없네\n나의 사는 모든 순간\n주께서 다스리시네\nChorus 4\n어느 것도 주 손에서\n날 빼앗지 못하리라\n주 오실 날 기다리며\n주 능력 안에 서리라\nBridge\n굳건한 반석이시니\n위에 내가 서리라\n그 위에 내가 서리라"}, {"title": "주님 내가 여기 있사오니", "lyrics": "Verse 1\n주님 내가 여기 있사오니 \n나를 보내소서\n나의 맘 나의 몸 \n주께 드리오니 \n주 받으옵소서\n주님 내가 여기 있사오니 \n나를 써주소서\n가진 것 모두 다 \n주께 드리오니\n주 받으옵소서\nVerse 2\n주님 내가 여기 있사오니 \n나를 써주소서\n가진 것 모두 다 \n주께 드리오니\n주 받으옵소서\nChorus \n렐루야 \n렐루야\n렐루야 \n렐루야"}, {"title": "주 하나님 지으신 모든 세계", "lyrics": "Verse 1\n주 하나님 지으신 모든 세계\n내 마음 속에 그리어 볼 때\n하늘의 별 울려 퍼지는 뇌성\n주님의 권능 우주에 찼네\nVerse 2\n숲\n속이나 험한 산 골짝에서\n지저귀는 저 새소리들과\n고요하게 흐르는 시냇물은\n주님의 솜씨 노래하도다\nVerse 3\n주 하나님 독생자 아낌없이\n우리를 위해 보내주셨네\n십자가에 피 흘려 죽으신 주\n내 모든 죄를 구속하셨네\nVerse 4\n내 주 예수 세상에 다시 올 때\n저 천국으로 날 인도하리\n나 겸손히 엎드려 경배하며\n영원히 주를 찬양하리라\nChorus\n주님의 높고 위대하심을\n내 영혼이 찬양하네\n주님의 높고 위대하심을\n내 영혼이 찬양하네"}, {"title": "예배자", "lyrics": "Verse 1\n아무도 예배하지 않는 \n그 곳에서 주를 예배하리라\n아무도 찬양하지 않는 \n그 곳에서 나 주를 찬양하리라\nVerse 2\n누구도 헌신하지 않는 \n그 곳에서 주께 헌신하리라\n누구도 증거하지 않는\n그 곳에서 나 주를 증거하리라\nChorus\n내가 밟는 모든 땅 \n주를 예배하게 하소서\n주의 보혈로 \n덮어지게 하소서\n내가 선 이 곳 \n주의 거룩한 곳 되게 하소서\n주의 향기로 물들이소서"}, {"title": "내가 예수 믿고서", "lyrics": "내가 예수 믿고서 죄사함\n받아 \n \n나의 모든것 다 변했네 \n지금내가 가는길 천국 길이요 \n주의 피로 내 죄가 씻겼네"}, {"title": "내 모든 시험 무거운 짐", "lyrics": "Verse 1\nChorus"}, {"title": "여호와께 돌아가자", "lyrics": "Verse\nChorus"}, {"title": "나의 영원하신 기업", "lyrics": "나의 영원하신 기업 생명보다 귀하다\n나의 갈 길 다 가도록 나와 동행 하소서"}, {"title": "세상의 유혹 시험이", "lyrics": "Verse 1\n세상의 유혹 시험이 \n내게 몰려 올 때에\n나의 힘으론 \n그것들 모두 이길 수 없네\n거대한 폭풍 가운데 \n위축된 나의 영혼\n어찌할 바를 몰라 \n헤매이고 있을 때\nVerse 2\n거짓과 속임수로 \n가득 찬 세상에서\n어디로 갈지 몰라 \n머뭇거리고 있네\n공중의 권세 잡은 자 \n지금도 우리들을\n실패와 절망으로 \n넘어뜨리려 하네\nVerse 3\n주위를 둘러보면 \n아무도 없는 듯\n믿음의 눈을 들면 \n보이는 분 계시네\n지금도 내 안에서 \n역사하고 계시는\n사망과 어둠의 권세 \n물리치신 예수님\nChorus\n주를 찬양 손을 들고 찬양\n전쟁은 나에게 속한 것 아니니\n주를 찬양 손을 들고 찬양\n전쟁은 하나님께 속한 것이니"}, {"title": "물이 바다 덮음 같이", "lyrics": "Verse\n세상 모든 민족이 구원을 얻기까지\n쉬지 않으시는 하나님\n주의 심장 가지고 우리 이제 일어나\n주 따르게 하소서\n세상 모든 육체가 주의 영광 보도록\n우릴 부르시는 하나님\n주의 손과 발 되어 세상을 치유하며\n주 섬기게 하소서\nChorus\n물이 바다 덮음 같이\n여호와의 영광을 인정하는 것이\n온 세상 가득하리라\n물이 바다 덮음 같이 \n물이 바다 덮음 같이\n물이 바다 덮음 같이\nBridge\n보리라 그날에 \n주의 영광 가득한 세상\n우리는 듣게 되리\n온 세상 가득한 승리의 함성"}, {"title": "내 평생 소원 이것뿐", "lyrics": "내 평생 소원 이것뿐 주의 일 하다가\n이 세상 이별하는 날 주 앞에 가리라\n꿈같이 헛된 세상일 취할 것 무어냐\n이 수고 암만 하여도 헛된 것 뿐일세\n불 같은 시험 많으나 겁내지 맙시다\n구주의 권능 크시니 이기고 남겠네\n금보다 귀한 믿음은 참 보배되도다\n이 진리 믿는 사람들 다 복을 받겠네\n살같이 빠른 광음을 주 위해 아끼세\n온 몸과 맘을 바치고 힘써서 일하세"}, {"title": "예수 우리들의 밝은 빛", "lyrics": "Verse\n예수 우리들의 밝은 빛\n은혜와 긍휼을 베푸시는 주\n의의 길을 따라가는 \n주의 자녀들에게\n항상 밝은 빛을 비추시네\n그는 구원의 주 하나님\n공의로 세상을 다스리시네\n주를 경외하는 자들에게 \n부어주시는\n놀라운 주님의 영광\nChorus \n하늘에서 찬란하게 빛나는\n주의 영광 이 땅에 오셨네\n어둠을 밝히고 \n새 생명 주시네\n영원히 빛나는 \n나의 예수님\n높이 영광과 찬양 받으실\n그 이름 경배합니다\n슬픔을 거두고 \n내게 자유주시네\n기쁨의 노래를 \n영원한 나의 빛 예수께\nTag\n기쁨의 노래를 \n영원한 나의 빛 예수께"}, {"title": "주는 나를 기르시는 목자", "lyrics": ""}, {"title": "주의 아름다움은 말로 다", "lyrics": "Verse 1\n주의 아름다움은 말로\n다\n형언할 수 없고\n주님의 그 놀라우심은\n다 표현할 수가 없네\n누가 그 지혜를 깨닫고\n누가 깊은 사랑 측량할까 \n보좌에 앉으신 주의 위엄 \n아름다우신 주님\nChorus 1\n내가 주를 경외함으로\n주님 앞에 홀로 섭니다\n찬양 받으시기 합당한\n거룩하신 주님\nChorus 2\n내 일생 소원은 늘 찬송하면서\n주께 더 나가기 원합니다\nChorus 3\n내 일생 소원은 늘 예배하면서\n주께 더 나가기 원합니다\nChorus 4\nAnd I stand, I stand in awe of You\nI stand, I stand in awe of You\nHoly God, to whom all praise is due \nI stand in awe of You"}, {"title": "주를 위한 이곳에", "lyrics": "Verse\n주를 위한 이곳에 예배하는 자들 중에\n그가 찾는 이 없어 주님께서 슬퍼하시네\n주님이 찾으시는 그 한 사람 그 예배자\n내가 그 사람 되길 간절히 주께 예배하네\nChorus\n주 은혜로 이곳에 서 있네\n주 임재에 엎드려 절하네\n그 어느 것도 난 필요 없네\n주님만 경배해\n주 은혜로 이곳에 서 있네\n주 임재에 엎드려 절하네\n그 어느 것도 난 필요 없네\n주님만 경배해"}, {"title": "마지막 찬양", "lyrics": "Verse\n완전하신 나의 주\n의의 길로 날 인도하소서\n행하신 모든 일 주님의 영광\n다 경배합니다\nChorus\n예배합니다 찬양합니다\n주님만 날 다스리소서\n예배합니다 찬양합니다\n주님 홀로 \n 받으소서"}, {"title": "예배합니다", "lyrics": "Verse\n완전하신 나의 주\n의의 길로 날 인도하소서\n행하신 모든 일 주님의 영광\n다 경배합니다\nChorus\n예배합니다 찬양합니다\n주님만 날 다스리소서\n예배합니다 찬양합니다\n주님 홀로 \n 받으소서\nTag\n주님 홀로 \n 받으소서"}, {"title": "주의 음성을 내가 들으니", "lyrics": "Verse 1\n주의 음성을 내가 들으니\n사랑하는 말일세\n믿는 맘으로 주께 가오니\n나를 영접하소서\nVerse 2\n주의 넓으신 은혜 베푸사\n나를 받아주시고\n나의 품은 뜻 주의 뜻 같이\n되게 하여 주소서\nVerse 3\n주의 보좌로 나아갈 때에\n어찌 아니 기쁠까\n주의 얼굴을 항상 뵈오니\n더욱 친근합니다\nVerse 4\n우리 구주의 넓은 사랑을\n측량할 자 없으며\n주가 주시는 참된 기쁨도\n헤아릴 수 없도다\nChorus\n내가 매일 십자가 앞에\n더 가까이 가오니\n구세주의 흘린 보배피로써\n나를 정케 하소서"}, {"title": "빛으로 비추시네", "lyrics": "Verse \n주의 선하심과 \n진실함을 닮기 원해\n그의 빛으로 나갈 때 \n그 성품 닮아가네\n빛을 닮아갈 때 \n주가 주신 자유함으로\n옳은 데로 돌아와서 \n별같이 비추네\nChorus\n빛으로 비추시네 \n어둠이 드러나고\n나를 숨은 허물에서 \n벗어나게 하시네\n빛으로 일어서네 \n어둠이 밝혀지고\n빛 되신 우리 주와 \n그 생명길 가네\nBridge \n내 영혼아 일어나 \n주의 빛 발하라\n주의 영광이 \n우리 위에 임하였네\n내 영혼아 일어나 \n주의 빛 발하라\n주의 영광이 \n우리 위에 임하였네"}, {"title": "주님 말씀하시면", "lyrics": "Verse\n주님 말씀하시면\n내가 나아가리다\n주님 뜻이 아니면\n내가 멈춰서리다\n나의 가고 서는 것\n주님 뜻에 있으니\n오 주님 나를 이끄소서\nPre chorus\n오 주님 나를 이끄소서\nChorus\n뜻하신 그곳에\n나 있기 원합니다\n이끄시는 대로 \n순종하며 살리니\n연약한 내 영혼 \n통하여 일하소서\n주님 나라와 그 뜻을 위하여\ntag\n오 주님 나를 이끄소서"}, {"title": "주님 다시 오실 때까지", "lyrics": "Verse 1\n주님 다시 오실 때까지\n나는 이 길을 가리라\n좁은 문 좁은 길\n나의 십자가 지고\n나의 가는 이 길 끝에서 \n나는 주님을 보리라\n영광의 내 주님\n나를 맞아 주시리\nPrechorus\n주님 다시 오실 때까지\n나는 일어나 달려가리라\n주의 영광 온 땅 덮을 때\n나는 일어나 노래하리\nchorus\n내 사모하는 주님\n온 세상 구주시라\n내 사모하는 주님\n영광의 왕이시라"}, {"title": "주님 다시 오실 때까지", "lyrics": "Verse 1\n주님 다시 오실 때까지\n나는 이 길을 가리라\n좁은 문 좁은 길\n나의 십자가 지고\n나의 가는 이 길 끝에서 \n나는 주님을 보리라\n영광의 내 주님\n나를 맞아 주시리\nPrechorus\n주님 다시 오실 때까지\n나는 일어나 달려가리라\n주의 영광 온 땅 덮을 때\n나는 일어나 노래하리\nChorus\n내 사모하는 주님\n온 세상 구주시라\n내 사모하는 주님\n영광의 왕이시라"}, {"title": "우리 주 십자가", "lyrics": "우리 주 십자가 고난 당하실 때에\n너는 거기 있었나\n죄인들 위하여 목숨 버리실 때에 \n너는 거기 있었나\n세상의 모든 것 소유한다고 해도\n네게 만족 없으며\n오직 주 예수님 네게 생명을 주사 \n참된 만족 주시네\n우리 주 조용히 너를 부르실 때에\n주께 모두 나오라\n오직 주 예수를 믿고 순종할 때에\n주가 영생 주시리\n저기 십자가에서 \n우리 위해 죽으신 주님\n너희는 무엇을 주저하고 있느냐 \n사랑의 주께로 오라"}, {"title": "Beautiful Savior", "lyrics": "Verse\nJesus, beautiful Saviour\nGod of all majesty, risen King\nLamb of God, Holy and righteous\nBlessed redeemer, bright morning star\nPrechorus\nAll the heavens shout Your praise\nAll creation bows to worship You\n itle": "청년의 기도", "lyrics": "Verse 1\n내게 주신 모든 것 주께 감사드리며\n많은 재물보다 더 복음을 선택하고\n화려한 길 아니라 진리의 길을 걷는\n거룩한 주 예수의 청년 되게 하소서\nVerse 2\n불의로 얻는 복은 당당히 포기하고\n하나님 보시기에 정결한 그릇되어\n이 땅에 날 보내신 하나님의 뜻대로\n주 영광 위해 사는 청년 되게 하소서\nPrechorus\n때론 연약해져도 방황 않게 하소서\n세상 험한 파도에 낙심 않게 하소서\nVerse 3\n내 이름 내려놓고 예수의 이름 들고\n어둔 세상 속에서 작은 생명 빛 되어\n천하보다 소중한 한 영혼 살리는 삶\n예수님 닮아가는 청년 되게 하소서\nChorus\n청년의 시절 지날 때\n날 지으신 주님 뜻대로\n하나님 예배하는 삶\n복음을 전하는 삶\n그렇게 살길 기도합니다\nTag\n그렇게 살길 기도합니다"}, {"title": "나의 안에 거하라", "lyrics": "Verse\n나의 안에 거하라 \n나는 네 하나님이니\n모든 환난 가운데 \n너를 지키는 자라\n두려워하지 말라 \n내가 널 도와주리니\n놀라지 말라 \n네 손 잡아주리라\nChorus\n내가 너를 지명하여 불렀나니 \n너는 내 것이라\n내 것이라 너의 하나님이라\n내가 너를 보배롭고 \n존귀하게 여기노라\n너를 사랑하는 네 여호와라"}, {"title": "예수 예수 예수", "lyrics": "Verse\n주님을 사랑하는 기쁨을 \n그 즐거움을 빼앗기지 않게 하소서\n주님을 사랑하는 기쁨을 \n그 즐거움을 \n빼앗기지 않게 하소서 \nChorus\n예수 예수 예수\n \n주님을 사랑합니다 \n예수 예수 예수\n \n주님을 사랑합니다 \n호산나 호산나 \n어서 오소서\n호산나 호산나 \n어서 오소서\nBridge\n오직 예수 이름에 능력 있네 \n예수 이름에 치유 있네\n예수 이름에\n권세 있네\n오직 예수 이름에 회복있네\n예수 이름에 자유 있네\n예수 이름에 \n구원 있네"}, {"title": "마지막 찬양", "lyrics": "Verse\n성령이여 내 영혼을 충만케 하소서\n내 속에 강물이 넘쳐나게\n성령이여 내 영혼을 충만케 하소서\n내 속에 강물이 넘쳐나게\nPrechorus\n오 성령 하나님\n날 다시 새롭게 하소서\nChorus \n채우소서 내 영혼이 세상 유혹 \n다 이기고 다시 주를 닮아가도록\n채우소서 내 영혼이 세상 유혹\n다 이기고 오직 주만 나타내도록"}, {"title": "성령이여 내 영혼을", "lyrics": "Verse\n성령이여 내 영혼을 충만케 하소서\n내 속에 강물이 넘쳐나게\nPrechorus 1\n오 성령 하나님\n날 다시 새롭게 하소서\nPrechorus 2 \n오 성령 하나님\n날 다시 새롭게\n오 성령 하나님\n날 다시 새롭게 하소서\nChorus \n채우소서 내 영혼이 \n세상 유혹 \n다 이기고 \n다시 주를 닮아가도록\n채우소서 내 영혼이 \n세상 유혹 \n다 이기고\n오직 주만 나타내도록"}, {"title": "나의 마음 주께", "lyrics": "Verse\n나의 소망은 주 경외함\n내 맘을 다해 주 경배해\n내 안에 모든 것 주 찬양해\n주님만 사모해 영원히\nChorus\n나의 맘을 주께 내 영을 주님께\n나 주 위해 살리\n살아 있는 동안 어느 순간에도\n나 주만 따르리"}, {"title": "성도의 노래", "lyrics": "Verse1\n환난 가난과 고난 수고로움 속에도\n성도는 그 믿음을 지켰네\n주를 섬기는 일에 자신을 다 드리며\n진리의 말씀과 성령으로 그 길을 걸었네\nPrechorus\n그리스도 안에서 새롭게 하시고\n그리스도로 인하여 자유케 되었네\nChorus 1\n우리는 무명하나 유명한 자요\n죽음의 위기 속에도 참 생명 가졌고\n근심하나 기뻐하며 가난하나 다른 이를\n부요케하는 자로다\nChorus 2\n우리는 무명하나 유명한 자요\n죽음의 위기 속에도 참 생명 가졌고\n근심하나 기뻐하며 가난하나 다른 이를\n모든 것 가진 자로다\nTag\n모든 것 가진 자로다\n모든 것 가진 자로다"}, {"title": "예수 피를 힘입어", "lyrics": "주의 보좌로 나아갈 때에\n어떻게 나가야 할까\n나를 구원한 주의 십자가\n그것을 믿으며 가네\nVerse2\n주의 보좌로 나아갈 때에\n나 여전히 부족하나\n나를 품으신 주의 그 사랑\n그것을 믿으며 가네\nPrechorus\n자격없는 내 힘이 아닌\n오직 예수님의 보혈로\n자격없는 내 힘이 아닌\n오직 예수님의 보혈로\nChorus\n십자가의 보혈 완전하신 사랑\n힘입어 나아갑니다\n십자가의 보혈 완전하신 사랑\n힘입어 예배합니다"}, {"title": "비전", "lyrics": "Verse\n우리 보좌앞에 모였네\n함께 주를 찬양하며\n하나님의 사랑 그 아들 주셨네\n그의 피로 우린 구원 받았네\n십자가에서 쏟으신 그 사랑\n강 같이 온 땅에 흘러\n각 나라와 족속 백성 방언에서\n구원받고 주 경배드리네\nChorus\n구원하심이 보좌에 앉으신\n우리 하나님과 어린양께 있도다\n구원하심이 보좌에 앉으신\n우리 하나님과 어린양께 있도다\nBridge 1\n영원 영원히 영원 영원히\n영원 영원히 주님께\nBridge 2\n영원 영원히 영원 영원히\n영원 영원히 어린양께 있도다"}, {"title": "내 눈 주의 영광을 보네", "lyrics": "Verse\n내 눈 주의 영광을 보네\n우리 가운데 계신 주님\n그 빛난 영광 온 하늘 덮고\n그 찬송 온 땅 가득해\n내 눈 주의 영광을 보네\n찬송 가운데 서신 주님\n주님의 얼굴은 온 세상 향하네\n권능의 팔을 드셨네\nChorus\n주의 영광 이곳에 가득해\n우린 서네 주님과 함께\n찬양하며 우리는 전진하리\n모든 열방 주 볼 때까지\nBridge\n하늘 아버지 우릴 새롭게 하사\n열방 중에서 주를 섬기게 하소서\n모든 나라 일어나 찬송 부르며\n영광의 주님을 보게 하소서"}, {"title": "주의 말씀 앞에 선", "lyrics": "Verse1\n주의 말씀 앞에 선 \n당신은 참된 예배자\n그토록 찾으시던\n하나님의 기쁨\nVerse2\n주의 부르심 따라 \n당신의 삶을 드릴 때\n세상은 당신 안에서 \n주의 영광 보리라\nChorus 1\n이 세상을 향한 \n거룩한 생명 빛 되어\n이 세상을 위한 \n구원의 소망 되어\n영원한 하나님의 나라 \n함께 세워 가리\nChorus 2\n이 세상을 이길 \n주님의 군사 되어\n이 세상을 섬길 \n주님의 손과 발 되어\n영원한 하나님의 나라 \n함께 세워 가리"}, {"title": "사명", "lyrics": "Verse\n주님이 홀로 가신 그길 나도 따라가오 \n모든 물과 피를 흘리신 그길을 나도 가오 \n험한 산도 나는 괜찮소 바다 끝이라도 나는 괜찮소 \n죽어가는 저들을 위해 나를 버리길 바라오 \n아버지 나를 보내주오 나는 달려가 겠소 \n목숨도 아끼지 않겠소 나를 보내주오 \n험한 산도 나는 괜찮소 바다 끝이라도 나는 괜찮소 \n죽어가는 저들을 위해 나를 버리길 바라오\n \n세상이 나를 미워해도 나는 사랑 하겠소 \n세상을 구원할 십자가 나도 따라가오 \n생명을 버리면서까지 나를 사랑한 당신 \n이 작은 나를 받아주오 나도 사랑하오"}, {"title": "내 영혼의 그윽히 깊은 데서", "lyrics": "Verse\n내 영혼의 그윽히 깊은데서 \n 맑은 가락이 울려나네 \n하늘 곡조가 언제나 흘러나와 \n내 영혼을 고이 싸네 \n내 맘속에 솟아난 이\n평화는 \n깊이 묻히인 보배로다 \n나의 보화를 캐내어 가져갈자 \n그 아무도 없으리라 \n평화 평화로다 \n하늘 위에서 내려오네 \n그 사랑의 물결이 영원토록 \n내 영혼을 덮으소서 \n그 사랑의 물결이 영원토록 \n내 영혼을 덮으소서"}, {"title": "예수 열방의 소망", "lyrics": "Verse 1\n예수 열방의 소망 \n예수 우리의 위로자\n주는 온 땅의 영원한 소망\nVerse 2\n예수 어둠속의 빛 \n예수 변함없는 진리\n주는 온 땅의 빛이 되시네\nPre-chorus\n우리 위해 죽으시고 \n다시 사신 생명의 주\nChorus\n주님만이 소망이요 \nYou rose from the dead, conquering fear\nOur Prince of Peace, drawing us near\nJesus our hope ,living for all who will receive\nLord we believe"}, {"title": "You are Holy", "lyrics": "Verse 1\nYou are holy (You are holy)\nYou are mighty (You are mighty )\nYou are worthy (You are worthy)\nWorthy of praise (Worthy of praise)\nI will follow (I will follow)\nI will listen (I will listen)\nI will love You (I will love You)\nAll of my days (All of my days)\nChorus\nI will sing to and worship\n(You are Lord of Lords You are King of Kings)\nThe King who is worthy\n(You are mighty God Lord of everything)\n I will love and adore Him\n(You’re Emmanuel You’re the Great I am)\nAnd I will bow down before Him\n(You’re the Prince of peace Who is the Lamb)\nI will sing to and worship\n(You are Lord of Lords You are King of Kings)\nThe King who is worthy\n(You are mighty God Lord of everything)\n I will love and adore Him\n(You’re Emmanuel You’re the Great I am)\nAnd I will bow down before Him\n(You’re the Prince of peace Who is the Lamb)\nYou're my Prince of peace\nAnd I will live my life for You\nTag\nYou're my Prince of peace\nAnd I will live my life for You"}, {"title": "Your name", "lyrics": "Verse 1\nAs morning dawns and evening fades\nYou inspire songs of praise\nThat rise from earth to touch Your heart \nand glorify Your Name\nCHORUS\nYour Name is a strong and mighty tower\nYour Name is a shelter like no other\nYour Name let the nations sing it louder\nCause nothing has the power to save\nBut Your Name\nVerse 2\nJesus, in Your Name we pray\nCome and fill our hearts today\nLord, give us strength to live for You \nand glorify Your Name"}, {"title": "I Stand in Awe", "lyrics": "Verse 1\nYou are beautiful beyond description\nToo marvelous for words\nToo wonderful for comprehension\nLike nothing ever seen or heard\nWho can grasp Your infinite wisdom\nWho can fathom the depth of Your love\nYou are beautiful beyond description\nMajesty, enthroned above\nChorus\nAnd I stand, I stand in awe of You\nI stand, I stand in awe of You\nHoly God to whom all praise is due\nI stand in awe of You\nVerse 2\nYou are beautiful beyond description\nYet God crushed You for my sin\nIn agony and deep affliction\nCut off that I might enter in\nWho can grasp such tender compassion\nWho can fathom this mercy so free\nYou are beautiful beyond description\nLamb of God who died for me"}, {"title": "하나님 아버지의 마음", "lyrics": "Verse 1\n아버지 당신의 마음이 있는 곳에\n나의 마음이 있기를 원해요\n아버지 당신의 눈물이 고인 곳에\n나의 눈물이 고이길 원해요\nVerse 2 \n아버지 당신이 바라보는 영혼에게\n나의 두 눈이 향하길 원해요\n아버지 당신이 울고 있는 어두운 땅에\n나의 두 발이 향하길 원해요\nChorus\n나의 마음이 \n아버지의 마음 알아\n내 모든 뜻 아버지의 \n뜻이 될 수 있기를\n나의 온 몸이 \n아버지의 마음 알아\n내 모든 삶 \n당신의 삶 되기를"}, {"title": "Nothing else", "lyrics": "Chorus 1\nI'm caught up in Your presence \nI just want to sit here at Your feet \nI'm caught up in this holy moment \nI never want to leave \nChorus 2\nI'm not here for blessings \nJesus, You don't owe me anything \nMore than anything that You can do \nI just want You \nVerse 1\nI'm sorry when I've just gone through the motions \nI'm sorry when I just sang another song \nTake me back to where we started \nI open up my heart to You \nVerse 2\nI'm sorry when I've come with my agenda\nI'm sorry when I forgot that You're enough \nTake me back to where we started\nI open up my heart to You \nBridge\nI \nust want You \nNothing else, Nothing else \nNothing else will do"}, {"title": "모든 상황 속에서", "lyrics": "Verse 1\n모든 상황 속에서 \n주를 찬양할지라\n주는 너의 큰 상급 \n큰 도움이시라\nVerse 2\n주의 얼굴 구할 때 \n주의 영을 부으사\n크신 사랑 안에서 \n주를 보게 하소서\nChorus\n내 영혼이 확정되고 \n확정되었사오니\n믿음의 눈 들어 \n주를 바라봅니다\n내 영혼이 확정되고 \n확정되었사오니\n믿음의 눈 들어 \n주를 바라봅니다\nBridge\n주를 찬양할때 \n주의 나라 이미 임했네\n그 영원한 나라 \n주 보게 하소서"}, {"title": "모든 상황속에서", "lyrics": "Verse 1\n모든 상황 속에서 \n주를 찬양할지라\n주는 너의 큰 상급 \n큰 도움이시라\nVerse 2\n주의 얼굴 구할 때 \n주의 영을 부으사\n크신 사랑 안에서 \n주를 보게 하소서\nChorus\n내 영혼이 확정되고 \n확정되었사오니\n믿음의 눈 들어 \n주를 바라봅니다\n내 영혼이 확정되고 \n확정되었사오니\n믿음의 눈 들어 \n주를 바라봅니다\nBridge\n주를 찬양할때 \n주의 나라 이미 임했네\n그 영원한 나라 \n주 보게 하소서"}, {"title": "아 하나님의  오직 주님만 갈망하네\nVerse 2\n주님 내 곁에 머물러 주세요 \n주 얼굴 볼때 커지는 사랑\n주 앞에 나의 모든 것 버리고 \n내 사랑 주님 따르기 갈망하네\nChorus\n나의 사랑이 더욱 커져가네\n주를 향한 내 사랑 더욱 깊어져만 가네"}, {"title": "내 구주 예수님", "lyrics": "Verse \n내 구주 예수님 주 같은 분 없네 \n내 평생에 찬양하리 놀라운 주의 사랑을\n위로자 되시며 피난처 되신 주님\n나의 영혼 온 맘 다해 주를 경배합니다\nChorus 1\n온 땅이여 주님께 외쳐라\n능력과 위엄의 왕 되신 주\n산과 바다 소리쳐 주의 이름을 높이리\n주 행한 일 기뻐 노래하며 \n영원히 주님을 찬양하리라\n신실하신 주의 약속 나 받았네\nChorus 2\nShout to the Lord\nAll the earth let us sing\nPower and majesty\nPraise to the King\nMountains bow down\nAnd the seas will roar\nAt the sound of Your name\nI sing for joy\nAt the work of Your hands\nForever I'll love You\nForever I'll stand\nNothing compares to\nhe promise I have in You\nNothing compares to\nhe promise I have in You"}, {"title": "Psalm 13", "lyrics": "How long O LORD?\nWill you forget me forever?\nHow long will you hide your face from me?\nHow long must I wrestle with my thoughts\nAnd everyday have sorrow in my heart?\nHow long will my enemy triumph over me?\nLook on me and answer\nO LORD my God\nGive light to my eyes\nOr I will sleep in death\nMy enemy will say\nI have overcome him\nAnd my foes will rejoice when I fall\nBut I trust in your unfailing love\nMy heart rejoices in your salvation\nI will\n to the LORD\nFor he has been good to me\nBut I trust in your unfailing love\nMy heart rejoices in your salvation\nI will \nto the LORD\nFor he has been good to me"}, {"title": "찬송가 120장", "lyrics": "슬픈 마음 있는 사람 예수 이름 믿으면\n영원토록 변함없는 기쁜 마음 얻으리\nVerse 2\n거룩하신 주의 이름 너의 방패 삼으라\n환난 시험 당할 때에 주께 기도드려라\n존귀하신 주의 이름 우리 기쁨 되도다\n주의 품에 안길 때에 기뻐 찬송 부르리\n우리 갈 길 다 간 후에 보좌 앞에 나아가\n왕의 왕께 경배하며 면류관을 드리리\n예수의 이름은 세상의 소망이요\n예수의 이름은 천국의 기쁨일세"}, {"title": "찬송가 120장 \"오 베들레헴 작은 골\"", "lyrics": "Verse 1\n참 반가운 성도여 다 이리와서 베들레헴\n성 안에 가 봅시다 저 구유에 누이신아기를 보고\nChorus\n엎드려 절하세 엎드려 절하세\n엎드려 절하세 구주 나셨네 \nChorus 2\n엎드려 절하세 엎드려 절하세\n엎드려 절하세 구주 나셨네 아멘\nVerse 2\n저 천사여 찬송을 높이 불러서 이 광활한\n천지에 울리어라 주 하나님 앞에 늘 영광을 돌려\nVerse 3\n이 세상에 주께서 탄생할 때에 참신과 참\n사람이 되시려고 저 동정녀 몸에서 나시었으니\nVerse 4\n여호와의 말씀이 육신을 입어 날 구원할\n구주가 되셨도다 늘 감사한 찬송을 주 앞에 드려"}, {"title": "주님의 마음이 있는곳", "lyrics": "Verse\n주님의 마음이 있는 곳 \n주님의 시선이 있는 곳 내가 있기 원하네\n광야에 꽃을 피우시고 \n사막에 강물을 내시는 주의 놀라운 손길\nPrechorus\n풀은 마르고 꽃은 시드나 \n주의 말씀은 영원하네 \n전능하신 주 거룩하신 왕 \n주님의 말씀 이루시네\nChorus\n나의 맘 주의 성전이 되어 \n영원한 주의 말씀을 향해\n주의 마음 있는 곳으로 \n나의 삶 주의 말씀을 따라 \n이루실 주의 나라를 향해 \n주의 시선 있는 곳\nBridge\n주님의 마음 있는 곳 \n주님의 시선 있는 곳\n내가 있기 원하네"}, {"title": "나의 모습 나의 소유", "lyrics": "Verse1\n나의 모습 나의 소유 \n주님 앞에 모두 드립니다\n모든 아픔 모든 기쁨 \n내 모든 눈물 받아주소서\nVerse2\n어제일 과 내일 일도 \n꿈과 희망 모두 드립니다\n모든 소망 모든 계획 \n내 손과 마음 받아주소서\nChorus\n나의 생명을 드리니\n주 영광 위하여 사용 하옵소서 \n내가 사는 날 동안에 \n주를 찬양하며 기쁨의 제물 되리 \n나를 받아주소서\nBridge\n우리 가진 이모든 것들을\n다 주께서 우리에게 주시었네 \n몸 밖에 드릴 것이 없으니\n내 삶을 받아주소서"}, {"title": "나의 약함은 나의 자랑이요", "lyrics": "Verse 1\n참 고마운 친구 나의 예수님\n나는 깨지기 쉬운 질그릇과 같으나 \n때론 낙심해도 포기치 않음은 \n예수의 생명이 내 안에 있기에\nVerse 2\n내 삶의 동행자 나의 예수님\n나는 기대가 없는 어린 나귀 같으나 \n늘 쓰러지나 다시 일어남도\n예수의 생명이 내 안에 있기에\nChorus\n나의 약함은 나의 자랑이요\n나의 실패는 나의 간증이요\n나의 아픔은 나의 영광이니\n그 부르심 따라 내가 걸어갑니다\nBridge\n그 부르심 따라\n그 부르심 따라\n그 부르심 따라\n그 부르심 따라\nPrechorus\n나 가난함은 나의 상급이요\n나 미련함은 나의 자랑이요\n나 쓰러짐이 나의 고백이니\n그 부르심 따라 내가 걸어갑니다"}, {"title": "기쁨의 날 주시네", "lyrics": "Verse 1\n주님은 내 맘의 아픔 알아주시니\n지난밤 눈물 지워주시고\n아침에 돋아난 여린 풀들과 같이\n내 맘을 새롭게 하네\n흐르는 시간에 보인 주의 영광은\n내 삶을 밝게 비춰주시니\n온 땅과 모든 산보다 전에 계셨던 주님\n창조의 주를 찬양하네\nChorus\n주님은 거친 바다 위 나의 영혼\n두 손으로 굳게 잡아주시네\n주님께 맡긴 인생의 여정 속에\n아픔만큼 기쁨의 날 주시네\nVerse 2\n흐르는 시간에 보인 주의 영광은\n내 삶을 밝게 비춰주시니\n온 땅과 모든 산보다 전에 계셨던 주님\n창조의 주를 찬양하네\nChorus 2 \n주님은 거친 바다 위 나의 영혼\n두 손으로 굳게 잡아주시네\n주님께 맡긴 인생의 여정 속에\n아픔만큼 기쁨의 날 주시네\n주님은 거친 바다 위 나의 영혼\n두 손으로 굳게 잡아주시네\n주님께 맡긴 인생의 여정 속에\n아픔만큼 기쁨의 날 주시네\n주님은 거친 바다 위 나의 영혼\n두 손으로 굳게 잡아주시네\n주님께 맡긴 인생의 여정 속에\n아픔만큼 기쁨의 날 주시네\n주님은 거친 바다 위 나의 영혼\n두 손으로 굳게 잡아주시네\n주님께 맡긴 인생의 여정 속에\n아픔만큼 기쁨의 날 주시네\n주님은 거친 바다 위 나의 영혼\n두 손으로 굳게 잡아주시네\n주님께 맡긴 인생의 여정 속에\n아픔만큼 기쁨의 날 주시네\n주님은 내 맘의 아픔 알아주시니\n지난밤 눈물 지워주시고\n아침에 돋아난 여린 풀들과 같이\n내 맘을 새롭게 하네"}, {"title": "Everlasting God", "lyrics": "Verse 1\nStrength will rise as we wait upon the Lord\nWe will wait upon the Lord,\nwe will wait upon the Lord\ dge\nVerse 2 \n비추소서 나도 주님의 빛을 비추리라"}, {"title": "내 영혼은 안전합니다", "lyrics": "내 아버지 그 품안에서 \n내 영혼은 안전합니다\n주 손길로 내 삶을 안으시니\n그 평강이 나를 덮습니다 \n나 비록 넘어지며 흔들리지만 \n주\n내 안에 거하며 나를 붙드시니\n내 생각을 주께로 돌리고\n주시는 평강의 옷을 입습니다\n주 약속 안에서 내 영혼 평안해\n내 뜻보다 크신 주님의 계획 나 신뢰해\n두려움 다 내려놓고 주님만 의지해\n주 안에서 내 영혼 안전합니다\nTag\n두려움 다 내려놓고\n두려움 다 내려놓고\n두려움 다 내려놓고 주님만 의지해\n주안에서 내 영혼 안전합니다"}, {"title": "예수 이름 높이세", "lyrics": "수 많은 무리들 줄지어 \n그 분을 보기 위해 따르네\n평범한 목수이신 그 분 앞에 \n모든 무릎이 꿇어 경배하네\n모든 문제들 하나하나 \n죽음까지도 힘을 잃고\n생명의 근원 되신 예수 이름 앞에 \n모든 권세들 굴복하네\n나의 계획이 실패하고 \n나의 소망이 끊어질 때\n삶의 주관자 되신 그 분 앞에 \n나의 무릎을 꿇어 경배하네\n나의 삶을 그 분께 맡길 때 \n비로소 나의 마음 평안해\n구원의 반석되신 예수의 이름을 \n소리 높여 찬송하네\n예수 이름 높이세 능력의 그 이름\n예수 이름 높이세 구원의 그 이름\n예수 이름을 부르는 자 \n예수 이름을 믿는 자\n예수 이름 앞에 나오는 자 \n복이 있도다\nTag\n예수 이름을 부르는 자 \n예수 이름을 믿는 자\n예수 이름 앞에 나오는 자 \n복이 있도다"}, {"title": "내 안에 사는 이", "lyrics": "내 안에 사는 이 예수 그리스도니\n나의 죽음도 유익함이라\n나의 왕 내 노래 내 생명 또 내 기쁨\n나의 힘 나의 검 내 평화 나의 주"}, {"title": "주 품에", "lyrics": "주\n품에 품으소서\n능력의 팔로 덮으소서\nVerse 2\nFind rest my soul \nin Christ alone\nKnow His power in \nquietness and trust\n거친파도 날 향해와도 \n주와 함께 날아오르리\n폭풍 가운데 나의 영혼 \n잠잠하게 주를 보리라\nChorus 2 \nWhen the oceans rise\nand thunders roar \nI will soar with you\nabove the storm\nFather you are king \nover the flood \nI will be still and \nknow you are God"}, {"title": "선한 목자 되신 우리 주", "lyrics": "Verse 1\n선한 목자되신 우리 주\n항상 인도하시고\n푸른 풀밭 좋은 곳에서\n우리 먹여주소서\n선한 목자 구세주여\n항상 인도하소서\n선한 목자 구세주여\n항상 인도하소서\nVerse 2\n양의 문이 되신 예수여\n우리 영접하시고\n길을 잃은 양의 무리를\n항상 인도하소서\n선한 목자 구세주여\n기도 들어주소서\n선한 목자 구세주여\n기도 들어주소서\nVerse 3\n흠이 많고 약한 우리를\n용납하여 주시고\n주의 넓고 크신 은혜로\n자유 얻게 하소서\n선한 목자 구세주여\n지금 나아갑니다\n선한 목자 구세주여\n지금 나아갑니다\nVerse 4\n일찍 주의 뜻을 따라서\n살아가게 하시고\n주의 크신 사랑 베푸사\n따라가게 하소서\n선한 목자 구세주여\n항상 인도하소서\n선한 목자 구세주여\n항상 인도하소서"}, {"title": "문들아 머리 들어라", "lyrics": "Verse\n&#xA;\n문들아 머리 들어라 \n들릴지어다 영원한 문들아\n영광의 왕 들어 가시도록 \n영광의 왕 들어 가신다\n&#xA;\nChorus\n영광의 왕 뉘시뇨\n강하고 능하신 주로다\n전쟁에 능하신 주시라\n다 찬양 위대하신\n왕\nChorus 2\n당신은 영광의 왕이라\n다 찬양 위대하신 왕"}, {"title": "주님 무어라 말할까요", "lyrics": ""}, {"title": "목마른 사슴이", "lyrics": "목마른 사슴\n시냇물을 찾아 헤매이듯이\n내 영혼 주를 \n간절히 알기 원하네\n구름이 걷히면 \n희망의 태양 떠오듯\n주 사랑 내 삶을 \n환하게 비춰 주시네\n주님의 사랑 날 찾아와 \n어둔 내 눈 밝히시네\n영혼 기뻐 \n노래하네 주 볼\n때\n전한 곳에 날 세우시네\n사슴처럼 뛰게 하네\n무엇을 하든 어딜 가든\n주 사랑\n나를 인도하네\n말보다 일보다 \n중심을 원하시는 주\n나\n이제 주님만 \n사랑하게 하소서\n먼\n훗날 주 앞에 \n서는 날 주께 말하리\n사는 날 동안에 \n주님만 사랑했다고\n세상이 줄\n수 없는 사랑\n내 맘 고동치게 하네\n주\n곁에 날 이끄소서 \n오 주님\n주님 보기를 만져보기를\n주님 품에 안겨보기를\n나 이제 평생 사는 동안 \n주님만"}, {"title": "한 가지", "lyrics": ""}, {"title": "내 입술의 말과", "lyrics": ""}, {"title": "Celebrate", "lyrics": "Verse 1\nCelebrate \n주 행하신 모든 일 찬양\nClap your hands \n기쁨의 소리 주께 드려\nPreChorus\n모든 이름 위에 뛰어나신 이름\n찬양받기에 합당하신 이름\nChorus\nCome and celebrate celebrate\nCome and celebrate Jesus\nCome and celebrate celebrate\nCome and celebrate Jesus\nVerse 2\nPraise His name \n주 안에서 우리 기뻐해\nSomebody shout \n소리 높여 주 이름 찬양\nTag\nOn the left on the left \n주를 찬양\nOn the right on the right \n주를 찬양\nOn the left on the left \n주를 찬양\nOn the right on the right \n주를 찬양\nEverybody 주님을 찬양\nChorus 2\nCome and celebrate celebrate\nCome and celebrate Jesus\nCome and celebrate celebrate\nCome and celebrate Jesus\nCome and celebrate"}, {"title": "Your Grace Is Enough", "lyrics": "Verse 1\nGreat is Your faithfulness, oh God\nYou wrestle with the sinner's \n \nheart\nYou lead us by still waters and to mercy\nAnd nothing can keep us apart\nPrechorus\nSo remember Your people\nRemember Your children\nRemember Your promise, oh God\nChorus\nYour grace is enough\nYour grace is enough\nYour grace is enough for me\nYour grace is enough\nYour grace is enough\nYour grace is enough for me\nVerse 2\nGreat is Your love and justice, God\nYou use the weak to lead the strong\nYou lead us in the song of Your salvation\nAnd all Your people sing along\nTag\nYour grace is enough\nHeaven reaches out to us\nYour grace is enough for me\nGod, I see Your grace is enough\nI'm covered in Your love\nYour grace is enough for me, for me"}, {"title": "매일매일", "lyrics": "Verse 1"}, {"title": "시선", "lyrics": "Verse 1\n내게로부터 눈을 들어\n주를 보기 시작 할 때\n주의 일을 보겠네\n내 작은 마음 돌이키사\n하늘의 꿈 꾸게 하네\n주님을 볼 때\nVerse 2\n성령이 나를 변화시켜\n모든 두렴 사라질 때\n주의 일을 보겠네\n황폐한 땅 한가운데서\n주님 마음 알게 되리\n주님을 볼 때\nChorus 1 \n모든 시선을 주님께 드리고\n살아 계신 하나님을 느낄 때\n내\n삶은 주의 역사가 되고\n하나님이 일하기 시작하네\nChorus 2\n모든 시선을 주님께 드리고\n전능하신 하나님을 느낄 때\n세상은 주의 나라가 되고\n하나님이 일하기 시작하네\nBridge\n주님의 영광 임하네 주 볼 때\n내\n삶은 주의 역사가 되고\n하나님이 일하기 시작하네"}, {"title": "Here I am to worship", "lyrics": "Verse 1\n우리 주 하나님 \n큰 영광과 존귀를 받기에 합당하신 \n지금 여기 계신 하나님\n온 천지 만물을 \n지으시고 다스리는 \n큰 권능과 능력으로 \n주의 말씀 이루시리 \n주 임재 하실 때\n모든 만물 경배하리\n어둠 권세 물러가네\n오셔서 다스리소서\nChorus\n거룩 거룩하다\n거룩하다 주 하나님\n곧 전능하신이여 \n하나님 나라 임하네\nVerse 2\n주 임재 하실 때 \n모든 만물 경배하리\n어둠 권세 물러가네 \n오셔서 다스리소서\nBridge\n어제도 계셨고 \n오늘도 계시며\n이제 곧 오실 우리 왕\n어제도 계셨고 \n오늘도 계시며\n이제 곧 오실 우리 왕"}, {"title": "Here I am to Worship", "lyrics": "Verse 1\nSo here I am to worship\nHere I am to bow down\nHere I am to say that You're my God\nVerse 2\nYou're altogether lovely\nAltogether worthy\nAltogether wonderful to me\nVerse 3\n나 주를 경배하리\n엎드려 절하며 고백해\n주 나의 하나님\nVerse 4\n오 사랑스런 주님\n존귀한 예수님\n아름답고 놀라우신 주"}, {"title": "God of This City", "lyrics": "Verse 1\nYou're the God of this city\n주는 이 도시의 주\nYou're the King of these people\n주는 이 백성의 왕\nYou're the Lord of this nation You are \n이 나라의 주 되신 주님\nVerse 2\nYou're the light in this darkness\n주는 어둠 속의 빛\nYou're the hope to the hopeless\n절망 가운데 소망\nYou're the peace to the restless You are\n참된 평화 되시는 주님\nPrechorus\nThere is no one like our God\n주와 같은 분 없네\nThere is no one like our God\n주와 같은 분 없네\nChorus\nFor greater things have yet to come\n더 위대한 일 이 땅에\nAnd greater things are still to be done in this city\n더 놀라운 일 이 도시에 이뤄지리\nGreater things have yet to come\n위대한 일 이 땅에\nAnd greater things are still to be done in this city\n더 놀라운 일 이 도시에 이뤄지리\nChorus 2\nFor greater things have yet to come\n더 위대한 일 이 땅에\nAnd greater things are still to be done \nin this city\n더 놀라운 일 이 도시에 이뤄지리\nGreater things have yet to come\n위대한 일 이 땅에\nAnd greater things are still to be done\n더 놀라운 일 이 도시에 이뤄지리\nWe believe, we believe in you, God\nTag\nGreater things have yet to come\n위대한 일 이 땅에\nAnd greater things are still to be done in this city\n더 놀라운 일 이 도시에 이뤄지리\nTag 2\nGreater things have yet to come\n위대한 일 이 땅에\nAnd greater things are still to be done here\n더 놀라운 일 주 행하시리"}, {"title": "나를 부르신 주", "lyrics": "Verse\n나를 부르신 주가 \n이루어 주시네\n잠시 넘어지더라도 \n붙잡아 주시네\n나의 걸어가는 길 \n늘 동행하시네\n혼자라 생각했던 삶 \n늘 함께 하셨네\nChorus\n나 찬양해 언제나 어디서나\n부르신 그 뜻대로\n나를 지으신 주의 뜻대로\n나 찬양해 영원토록 \n노래하네\n나를 부르신대로\n주를 찬양하며 살아가리라"}, {"title": "높이 계신 주께", "lyrics": ""}, {"title": "빈 들에 마른 풀 같이", "lyrics": "Verse 1\n빈 들에 마른 풀 같이\n시들은 나의 영혼\n주님의 허락한 성령 \n간절히 기다리네\nChorus\n가물어 메마른 땅에 \n단비를 내리시듯\n성령의 단비를 부어 \n새 생명 주옵소서\nVerse 2\n반가운 빗소리 들려 \n산천이 춤을 추네\n봄비로 내리는 성령 \n내게도 주옵소서\nVerse 3\n철 따라 우로를 내려 \n초목이 무성하니\n갈급한 내 심령 위에 \n성령을 부으소서\nVerse 4\n참 되신 사랑의 언약 \n어길 수 있사오랴\n오늘에 흡족한 은혜\n주실 줄 믿습니다"}, {"title": "주 앞에 엎드려", "lyrics": "Verse \n주 앞에 엎드려 경배합니다\n오직 주께\n주 경배합니다 다른 신 아닌\n오직 주께\nChorus\n나의 모든 우상들 나의 보좌\n모두 다 내려놓고\nChorus 2\n주 앞에 엎드려 경배합니다\n오직 주께\nTag\n나의 모든 우상들 나의 보좌\n모두 다 내려놓고"}, {"title": "온 세상 창조주", "lyrics": "Verse 1\n온 세상 창조주 \n온 세상 구원자\n모든 것 이기신 \n능력의 하나님\nVerse 2\n하나님 열방을 \n우리게 주셨네\n그 명령 따라서 \n열방을 취하리\nPrechorus\n모든 만물 주를 찬양해\n모든 민족 주께 경배해\nChorus 1\n모두 승리하리 \n열방 얻게 되리\n하나님께서 \n통치하시네\n모두 승리하리 \n열방 얻게 되리\n위대하신 왕 \n여호와\nChorus 2\n찬양 할렐루야 \n찬양 할렐루야\n하나님께서 \n통치하시네\n찬양 할렐루야 \n찬양 할렐루야\n위대하신 왕 \n여호와\nTag\n위대하신 왕 \n여호와"}, {"title": "모든 능력과 모든 권세", "lyrics": "Verse\n모든 능력과 모든 권세\n모든 것 위에 뛰어나신 주님\n세상이 측량할 수없는 지혜로\n모든 만물 창조하셨네\n모든 나라와 모든 보좌\n이 세상 모든 경이로움 보다\n이 세상 모든 값진 보물보다\n더욱 귀하신 나의 주님\nChorus\n십자가 고통\n당하사 \n버림받고 외면 당하셨네\n짓밟힌 장미꽃처럼 \n나를 위해 죽으셨네 \n나의\n주\nTag\n짓밟힌 장미꽃처럼 \n나를 위해 죽으셨네 \n나의\n주"}, {"title": "왕께 만세", "lyrics": "Verse 1\n땅의 모든 끝이 주를 기억하고\n주께 돌아오네 경배드리네\n나라는 주의 것\n우리 하나님은 만유의 주재\nVerse 2\n내 모든 죄 위해 십자가 지셨네\n사망의 권세를 깨뜨리셨네\n생명은 주의 것\n우리 하나님은 구원의 주인\nVerse 3\n영원한 문들아 머릴 들찌어다\n영광의 왕이 들어가신다\n그 왕이 뉘시뇨 전쟁의 능하신\n우리 하나님은 강하신 여호와\nPrechorus\n영원부터 영원까지 \n다스리시네\n모든 성도 주 앞에 \n나와 크게 외치네\nChorus\n왕께 만세 왕께 만세\n보좌 위 하나님과 어린 양께\nTag"}, {"title": "그 크신 하나님의 사랑", "lyrics": "그 크신 하나님의 사랑 \n말로 다 형용 못하네\n저 높고 높은 별을 넘어 \n이 낮고 낮은 땅 위에\nPre Chorus 1\n죄 범한 영혼 구하려 \n그 아들 보내사\n화목제로 삼으시고 \n죄 용서하셨네\n하나님 크신 사랑은 \n측량 다 못하네\n영원히 변치 않는 사랑 \n성도여 찬양하세\n괴로운 시절 지나가고\n땅 위의 영화 쇠할 때\n주 믿지 않던 영혼들은 \n큰 소리 외쳐 울어도\nPre Chorus 2 \n주 믿는 성도들에게 \n큰 사랑 베푸사\n우리의 죄 사했으니 \n그 은혜 잊을까\n하늘을 두루마리 삼고 \n바다를 먹물 삼아도\n한없는 하나님의 사랑 \n다 기록할 수 없겠네\nPre Chorus 3\n하나님의 크신 사랑 \n그 어찌 다 쓸까\n저 하늘 높이 쌓아도 \n채우지 못하리"}, {"title": "형제의 모습 속에", "lyrics": "Verse 1\n 모습속에 보이는\n하나님 형상 아름다와라\n존귀한 주의 자녀 됐으니\n사랑하며 섬기리\nVerse 2\n자매의 모습속에 보이는\n하나님 형상 아름다와라\n존귀한 주의자녀 됐으니\n사랑하며 섬기리\nVerse 3\n우리의 모임 중에 임하신\n하나님 영광 아름다와라\n존귀한 왕이 여기 계시니\n사랑하며 섬기리\nTag\n사랑하며 섬기리"}, {"title": "나의 믿음 주께 있네", "lyrics": "Verse 1\n나의 믿음 주께 있네\n십자가 능력이 내 영광되었네\n주께서 우리를 승리케 하셨네\n나의 능력 나의 소망 주께 있네\nVerse 2\n오직 예수 나의 믿음\n십자가 능력 속에 빛나는 영광\n내 모든 승리로 주님께 영광을\n나의 능력 나의 소망 주께 있네\nTag\n나의 능력 나의 소망 \n주께 있네\nTag 2 \nIn Christ alone, \nI place my trust\nAnd find my glory in \nthe power of the cross\nIn every victory, \nlet it be said of me\nMy source of strength, \nmy source of hope\nis Christ alone"}, {"title": "예수 나를 오라하네", "lyrics": "Verse 1\n예수 나를 오라하네 \n예수 나를 오라하네\n어디든지 주를 따라 \n주와 같이 같이 가려네\nChorus\n주의 인도하심 따라 \n주의 인도하심 따라\n어디든지 주를 따라 \n주와 같이 같이 가려네\nVerse 2\n겟세마네 동산까지 \n주와 함께 가려 하네\n피땀 흘린 동산까지 \n주와 함께 함께 가려네\nVerse 3\n심판하실 자리까지 \n주와 함께 가려하네\n심판하실 자리까지 \n주와 함께 함께 가려네\nVerse 4\n주가 크신 은혜내려 \n나를 항상 돌보시고\n크신 영광 보여 주며 \n나와 함께 함께 가시네"}, {"title": "이 눈에 아무 증거 아니 뵈어도", "lyrics": "Verse1\n이 눈에 아무 증거 아니뵈어도\n믿음만을 가지고서 늘 걸으며\n이 귀에 아무 소리 아니들려도\n하나님의 약속 위에 서리라\nVerse2\n이 눈이 보기에는 어떠하든지\n이미 얻은 증거대로 늘 믿으며\n이 맘에 의심없이 살아갈때에\n우리 소원 주 안에서 이루리\nVerse3\n주님의 거룩함을 두고 맹세한\n주 하나님 아버지는 참 미쁘다\n그 귀한 모든 약속 믿는자에게\n능치 못할 무슨일이 있을까\nChorus\n걸어가세 믿음 위에 서서 \n나가세 나가세 의심 버리고\n걸어가세 믿음 위에 서서 \n눈과 귀에 아무 증거 없어도"}, {"title": "부족함 없네", "lyrics": "Verse1\n나의 공급자 또 내 생명\n놀라우신 하나님\n주 나의 상급 삶의 이유\n놀라우신 하나님\nVerse2\n내 죄 위하여 대속하신\n놀라우신 하나님\n놀라우신 하나님\nChorus\n주님의 그 모든 것이\n내 삶을 가득 채우네\n내 모든 갈증과 필요\n주 사랑으로 만족시키니\n주님의 그 모든 것이\n내 삶을 가득 채우네\n내 모든 갈증과 필요\n주 사랑으로 만족시키니 부족함 없네\nBridge\n내가 원하는 의 강물 흘러 넘치네\nV\n주님의 강이 충만케 되네\n닿는 자마다 치유케 되네\n그 강가에 있는 병든 자들\n주 갈급하며 돌아오리라\nV\nC\n주님의 강이 우릴 즐겁게 해\n주님의 강이 춤추게 해\n주님의 강이 우릴 새롭게 해\n기쁨으로 충만케 하네"}, {"title": "오소서 성령이여", "lyrics": "Chorus\n성령이여 임하소서 우리에게 임하소서\n주를 떠난 우리에게 오소서 성령이여\n주가 다시 세운 나라 주만 위해 사는 나라\n부흥의 불타는 나라 오소서 성령님\nBridge\n성령이여 임하소서 이 땅 위에 임하소서\n주를 떠난 이 땅위에 오소서 성령이여\n주가 다시 세운 나라 주만 위해 사는 나라\n부흥의 불타는 나라 오소서 성령님\nTag\n오소서 성령님"}, {"title": "내맘에 눈을 여소서", "lyrics": "문들아 머리 들어라 \n들릴지어다 영원한 문들아\n영광의 왕 들어 가시도록 \n영광의 왕 들어 가신다\nPrechorus\n영광의 왕 뉘시뇨\n강하고 능하신 주로다\n전쟁에 능하신 주시라\n다 찬양 위대하신\n왕"}, {"title": "Open the eyes of my heart", "lyrics": "Verse1\nOpen the eyes of my heart, Lord\nOpen the eyes of my heart\nI want to see You\nI want to see You\nVerse2\n내 맘의 눈을 여소서 내 맘의 눈을 열어\n주 보게 하소서 주 보게 하소서\nVerse3\n주 이름 높이 들리고 영광의 빛 비춰 주시며\n권능 넘치길 보기 원하네 거룩 거룩 거룩\nChorus\nTo see You high and lifted up\nShinin' in the light of Your glory\nPour out Your power and love\nAs we sing holy, holy, holy\nBridge\nHoly, holy, holy\nHoly, holy, holy\nHoly, holy, holy\nI want to see you\nTag\n거룩 거룩 거룩"}, {"title": "Open the eyes of my heart", "lyrics": "Verse1\nOpen the eyes of my heart, Lord\nOpen the eyes of my heart\nI want to see You\nI want to see You\nVerse2\n내 맘의 눈을 여소서 내 맘의 눈을 열어\n주 보게 하소서 주 보게 하소서\nVerse3\n주 이름 높이 들리고 영광의 빛 비춰 주시며\n권능 넘치길 보기 원하네 거룩 거룩 거룩\nChorus\nTo see You high and lifted up\nShining in the light of Your glory\nPour out Your power and love\nAs we sing holy, holy, holy\nBridge\nHoly, holy, holy\nHoly, holy, holy\nHoly, holy, holy\nI want to see you\nTag\n거룩 거룩 거룩"}, {"title": "창조의 아버지", "lyrics": "Verse1\n창조의 아버지 \n그 섭리 보이사\n택하신 세대 일으키어 \n이 땅을 고치소서\n주의 크신 능력 \n만물이 사모하니\n성령의 기름 부어 주사 \n이 시간 임하소서\nVerse2\n열방의 통치자 \n세상이 보리라\n신실한 주의 약속으로 \n교회는 승리하리\n우릴 돌아보사 \n강건케 하소서\n연약함 모두 벗어지고 \n승리케 하옵소서\nChorus\n주 영광 \n여기 임하사 \n열방 향해 \n그 빛 비추소서\n주의 얼굴 구할 때 \n주의 향기 머무소서\nBridge\n주의 나라가 \n임하옵시며 \n주님의 뜻이 \n이뤄지이다\n이 땅 가운데 하나님 아들 \n영광 보이소서"}, {"title": "주는 존귀하신 분", "lyrics": "Chorus\n주는 존귀하신분 \n주는 존귀하신분 \n만물 주께 나와 주께 \n돌아가니 영광 받으소서\nBridge\n주야로 기도의 향 올라가네\n주야로 기도의 향 올라가네\n주야로 기도의 향 올라가네\n주야로 기도의 향 올라가네"}, {"title": "Holy Spirit", "lyrics": "Chorus\nHoly Spirit, You are \nwelcome here\nCome \nthis place and \nfill the atmosphere\nYour \nGod is what our \nhearts long for\nTo be overcome \nby Your Presence Lord"}, {"title": "God So Loved", "lyrics": "Verse 1\nCome all you weary\nCome all you thirsty\nCome to the well\nThat never runs dry\nDrink of the water\nCome and thirst no more\nVerse 2\nCome all you sinners\nCome find His mercy\nCome to the table\nHe will satisfy\nTaste of His goodness\nFind what you're looking for\nChorus 1\nFor God so loved\nThe world that He gave us\nHis one and only\nSon to save us\nWhoever believes in Him\nWill live forever\nVerse 3\nBring all your failures\nBring your addictions\nCome lay them down\nAt the foot of the cross\nJesus is waiting there\nWith open arms\nChorus 2\nFor God so loved\nThe world that He gave us\nHis one and only\nSon to save us\nWhoever believes in Him\nWill live forever\nThe power of hell\nForever defeated\nNow it is well\nI'm walking in freedom\nFor God so loved\nGod so loved the world\nBridge\nPraise God\nPraise God\nFrom whom all blessings flow\nPraise Him\nPraise Him\nFor the wonders of His love\nChorus 3\nFor God so loved\nThe world that He gave us\nHis one and only\nSon to save\nVerse 4\nBring all your failures\nBring your addictions\nCome lay them down\nAt the foot of the cross\nJesus is waiting\nGod so loved the world"}, {"title": "This Is Amazing Grace", "lyrics": "Verse 1\nWho breaks the power \nof sin and darkness \n \nWhose love is mighty \nand so much stronger \nThe King of glory \nthe King above all\nVERSE 2\nWho shakes the whole \nearth with holy thunder\n \nAnd leaves us breathless \nin awe and wonder\n \nThe King of glory \nthe King above all\nCHORUS\nThis is amazing grace, \nthis is unfailing love\nThat You would take my place\nthat You would bear my cross\nYou laid down Your life \nthat I would be set free\nOh Jesus I sing for \nall that You've done for me\nVERSE 3\nWho brings our chaos \nback into order\nWho makes the orphan \na son and daughter\nThe King of glory \nthe King of glory\nVERSE 4\nWho rules the nations \nwith truth and justice\nShines like the sun in \nall of its brilliance\nThe King of glory \nthe King above all kings\nBRIDGE\nWorthy is the Lamb \nwho was slain\nWorthy is the King \nwho conquered the grave\nWorthy is the Lamb \nwho was slain\nWorthy is the King who \nconquered the grave\nWorthy is the Lamb \nwho was slain\nWorthy is the King who \nconquered the grave\nWorthy is the Lamb \nwho was slain\nWorthy, worthy, worthy"}, {"title": "What A Beautiful Name", "lyrics": "Chorus 2\nWhat a wonderful Name it is, \nwhat a wonderful Name it is\nThe Name of Jesus Christ \nmy King\nWhat a wonderful Name it is, \nnothing compares to this\nWhat a wonderful Name it is, \nthe Name of Jesus\nWhat a wonderful Name it is, \nthe Name of Jesus\nBridge 1\nDeath could not hold You, \nthe veil tore before You\nYou silenced the boast \nof sin and grave\nThe Heavens are roaring \nthe praise of Your glory\nFor You are raised \nto life again\nBridge 2\nYou have no rival, \nYou have no equal\nNow and forever, \nGod, You reign\nYours is the Kingdom, \nYours is the Glory\nYours is the Name \nabove all names\nChorus 3\nWhat a powerful Name it is, \nwhat a powerful Name it is\nThe Name of Jesus Christ \nmy King\nWhat a powerful Name it is, \nnothing can stand against\nWhat a powerful Name it is, \nthe Name of Jesus"}, {"title": "Altar", "lyrics": "Verse\nYou beckon me beckon me\nTo leave all that I've known\nYou beckon me beckon me\nTo call you as my own\nThis is life this is life\nTo bid me come and die\nSpirit of living God\nYou're all that satisfies\nAll that satisfies\nChorus 1\nHere I give \nmy everything\nSurrendered at the \naltar of my King\nFor I am His \nand He is mine\nOh I know that He will\nNever leave my side\nHe will never leave my side\nBridge\nMy desire is for You\nAll of Heaven adores You\nI've tasted and I've seen\nThat You are good\nYour kingdom's forever\nYour throne lasts forever\nAnd forever I will sing\nThat You are good\nChorus 2\n'Cause I'm hanging on\nTo Your every word\nLike a melody\nThat no one else has heard\nFor I am His\nAnd He is mine\nOh I know that He will\nNever leave my side"}, {"title": "Come Home Running", "lyrics": "Verse 1\nOh heart of mine why must you stray\nFrom One so fair you run away\nAnd one more time you have to pay\nThe heaviness of needless shame\nVerse 2\nOh heart of mine come back home\nYou've been too long out on your own\nAnd He's been there all along\nWatching for you down the road\nChorus\nSo come home running\nHis arms are open wide\nHis name is Jesus and He understands\nHe is the answer you are looking for\nSo come home running \njust as you are\nVerse 3\nOh child of God so dearly loved\nAnd ransomed by the saviour's blood\nCalled by name, daughter and son\nWrapped in the robe of righteousness"}, {"title": "At The Cross", "lyrics": "Verse 1\nOh Lord You've searched me\nYou know my way\nEven when I fail you\nI know You love me\nVerse 2\nYour holy presence\nSurrounded me\nIn every season\nI know You love me, I know You love me\nChorus \nAt the cross I bow my knees\nWhere Your blood was shed for me\nThere's no greater love \nthan this\nYou have overcome the grave\nGlory fills the highest place\nWhat can separate \nme now\nVerse 3\nYou go before me\nYou shield my way\nYour hand upholds me\nAnd I know You love me\nBridge\nYou tore the veil, You made a way\nWhen You said that it is done\nYou tore the veil, You made a way\nWhen You said that it is done"}, {"title": "이 세상 험하고", "lyrics": "Verse 1\n이 세상 험하고 \n나 비록 약하나\n늘 기도 힘쓰면 \n큰 권능 얻겠네\nVerse 2\n주님의 권능은 \n한없이 크오니\n돌 같은 내 마음 \n곧 녹여주소서\nVerse 3\n내 맘이 약하여 \n늘 넘어지오니\n주 예수 힘주사 \n굳세게 하소서\nVerse 4\n죄 사함 받은 후 \n새 사람 되어서\n주 앞에 서는 날 \n늘 찬송하겠네\nChorus\n주의 은혜로 \n대속 받아서 \n피와 같이 붉은 죄 \n눈 같이 희겠네"}, {"title": "주만 바라 볼찌라", "lyrics": "Verse 1\n하나님의 사랑을 사모하는 자\n하나님의 평안을 바라보는 자\n너의 모 ong?\nAnd the precious blood of Jesus\nWashes away our brokenness\nPre-Chorus 2\nAnd we can see that God You're moving\nA mighty river through Toronto\nAnd we can see that God You're moving\nA time of Jubilee is coming\nAnd young and old will turn to Jesus\nFling wide you heavenly gates\nPrepare the way of the \nRisen Lord"}, {"title": "Battle Belongs", "lyrics": "Verse 1\nWhen all I see is the battle\nYou see my victory\nWhen all I see is the mountain\nYou see a mountain moved\nAnd as I walk through the shadow\nYour love surrounds me\nThere's nothing to fear now \nFor I am safe with You\nChorus\nSo when I fight, \nI'll fight on my knees\nWith my hands lifted high\nOh God the battle belongs to You\nAnd every fear \nI lay at Your feet\nI'll sing through the night\nOh God, the battle belongs to You\nVerse 2\nAnd if You are for me\nWho can be against me?\nFor Jesus\nThere's nothing impossible for You\nWhen all I see are the ashes\nYou see the beauty\nWhen all I see is a cross\nGod You see the empty tomb\nBridge\nAlmighty fortress\nYou go before us\nNothing can stand against \nThe power of our God\nYou shine in the shadows\nYou win every battle\nNothing can stand against \nThe power of our God\nTag\nOh God, the battle belongs to You"}, {"title": "Refiner's Fire", "lyrics": "Verse 1\nPurify my heart\nLet me be as gold and precious silver\nPurify my heart\nLet me be as gold, pure gold Lord\nChorus\nRefiner's fire\nMy heart's one desire\nIs to be holy\nSet apart for You Lord\nI choose to be holy\nSet apart for You my master\nReady to do Your will\nPurify my heart\nCleanse me from within and make me holy\nPurify my heart\nCleanse me from my sin, deep within"}, {"title": "I Speak Jesus", "lyrics": "Verse 1\nI just want to speak \nThe name of Jesus\nOver every heart  \nAnd every mind\n'Cause I know there is peace \nWithin Your presence\nI speak Jesus\nVerse 2\nI just wanna speak \nThe name of Jesus\n'Til every dark addiction \nStarts to break\nDeclaring there is hope \nAnd th , "lyrics": "Verse\n보여지는 예배 아닌\n마음으로 드리는 예배\n노래하는 찬양보다\n삶으로 고백되는 예배\n나를 위한 예배 아닌\n주님 뜻을 향한 예배\n내 맘과 정성 다하여서\n주 앞에 드려지는 예배\nChorus \n주 앞에 엎드려 경배합니다\n온전한 예배 내 맘의 예배\n내 모든 것 받기 합당하신 분\n주 앞에 엎드려 예배합니다\n나의 모든 삶 나의 모든 뜻\n말씀 앞에 순종하는 삶의 예배\n드리기 원하네\nTag\n말씀 앞에 순종하는 삶의 예배\n드리기 원하네"}, {"title": "예수 이름 높이세", "lyrics": "Verse 1\n수많은 무리들 줄 지어 \n그분을 보기 위해 따르네\n평범한 목수이신 그 분 앞에 \n모든 무릎이 꿇어 경배하네\n모든 문제들 하나하나 \n죽음까지도 힘을 잃고\n생명의 근원되신 예수 이름 앞에 \n모든 권세들 굴복하네\nChorus 1\n예수 이름 높이세 \n능력의 그 이름\n예수 이름 높이세 \n구원의 그 이름\n예수 이름을 부르는 자 \n예수 이름을 믿는 자\n예수 이름 앞에 나오는 자 \n복이 있도다\nVerse 2\n나의 계획이 실패하고 \n나의 소망이 끊어질때\n삶의 주관자 되신 그분 앞에 \n나의 무릎을 꿇어 경배하네\n나의 삶을 그분께 맡길때 \n비로소 나의 마음 평안해\n구원의 반석 되신 예수의 이름을 \n소리 높여 찬송하네\nChorus 2\n할렐루야 찬양하세\n내 모든 죄 사함 받고 \n주 예수와 동행하니\n그 어디나 하늘나라"}, {"title": "삶의 예배", "lyrics": "Verse 1\n보여지는 예배 아닌\n마음으로 드리는 예배\n노래하는 찬양보다\n삶으로 고백되는 예배\nVerse 2\n나를 위한 예배 아닌\n주님 뜻을 향한 예배\n내 맘과 정성 다 하여서\n주 앞에 드려지는 예배\nChorus \n주 앞에 엎드려 경배합니다\n온전한 예배 내 맘의 예배\n내 모든 것 받기 합당하신 분\n주 앞에 엎드려 예배합니다\n나의 모든 삶 나의 모든 뜻\n말씀 앞에 순종하는\n삶의 예배 드리기 원하네\nTag\n주 앞에 엎드려 예배합니다\n나의 모든 삶 나의 모든 뜻\n말씀 앞에 순종하는 삶의 예배\n드리기 원하네"}, {"title": "때로는 너의 앞에", "lyrics": "Verse 1\n때로는 너의 앞에 \n어려움과 아픔 있지만\n담대하게 \n주를 바라보는 너의 영혼\nPre-Chorus 1\n너의 영혼 우리 볼 때 \n얼마나 아름다운 지\nVerse 2\n너는 택한 족속이요 \n왕 같은 제사장이며\n거룩한 나라 \n하나님의 소유된 백성\nPre-Chorus 2\n너의 영혼 우리 볼 때 \n얼마나 사랑스러운 지\nChorus\n너의 영혼 통해 \n큰 영광 받으실 \n하나님을 찬양 \n오 할렐루야\nVerse 3\n나는 택한 족속이요 \n왕 같은 제사장이며\n거룩한 나라 \n하나님의 소유된 백성\nPre-Chorus 3\n나의 영혼 우리 볼 때 \n얼마나 사랑스러운 지\nChorus 2\n나의 영혼 통해 \n큰 영광 받으실 \n하나님을 찬양 \n오 할렐루야"}, {"title": "천사 찬송하기를", "lyrics": "Verse1\n천사 찬송하기를 \n거룩하신 구주께\n영광 돌려보내세\n구주 오늘 나셨네\nChorus 1\n크고 작은 나라들\n기뻐 화답하여라\n영광 받을 왕의 왕\n베들레헴에 나신 주\n영광 받을 왕의 왕\n베들레헴에 나신 주\nVerse2\n오늘 나신 예수는 \n하늘에서 내려와 \n처녀 몸에 나셔서 \n사람 몸을 입었네 \nChorus 2\n세상 모든 사람들\n영원하신 주님께 \n영광 돌려 보내며 \n높이 찬양하여라 \n영광 돌려 보내며 \n높이 찬양하여라\nVerse3\n의로우신 예수는 \n평화의 왕이시고 \n세상 빛이 되시며 \n우리 생명 되시네 \nChorus 3\n죄인들을 불러서\n거듭나게 하시고 \n영생하게 하시니 \n왕께 찬양하여라 \n영생하게 하시니 \n왕께 찬양하여라\nBridge\nOH 베들레헴에 나신 주\nOH 주를 높여 찬양\nOH 영광 받을 왕의 왕\nOH 왕께 찬양하라"}, {"title": "그 이름 예수", "lyrics": "verse1\n내가 발견한 참 소망\n무엇보다 더 귀하신 나의 구원자\n날 향해 오래 참으시고\n오늘도 기다려주시는 나의 하나님\nverse2\n나를 찾아오신 사랑\n무엇보다 더 귀하신 나의 구원자\n길이요 진리요 생명인\n이땅의 유일한 소망 나의 하나님\nchorus 1\n그 이름 예수\n나의 맘을 다해 찬양해\n죽음에서 생명으로\n나의 영혼을 구하셨네 그 이름 예수\nchorus 2\n그 이름 예수\n나의 맘을 다해 찬양해\n죽음에서 생명으로\n나의 영혼을 구하셨네\n그 이름 예수\n나의 삶을 다해 노래해\n모든  나라 열방들이\n참된 소망을 노래하리 그 이름 예수\nbridge\n내 삶의 영원한 소망\n이 땅의 유일한 구원\n한없는 자비와 사랑\n십자가 빛나는 영광"}, {"title": "충만 - 특송", "lyrics": "무명이어도 공허하지 않은 것은\n예수 안에 난 만족함이라\n가난하여도 부족하지 않은 것은\n예수 안에 오직 나는 부요함이라\n고난 중에도 견뎌 낼 수 있는 것은\n주의 계획 믿기 때문이라\n실패하여도 일어설 수 있는 것은\n예수 안에 오직 나는 승리함이라\n난 예수로 예수로\n예수로 충만하네\n난 예수로 예수로\n예수로 충만하네\n난 예수로 예수로\n예수로 충만하네\n영원한 왕 \n내 안에 살아계시네\n내 몸이 약해도 낙심하지 않는 것은\n예수 안에 난 완전함이라\n화려한 세상 부럽지 않은 것은\n난 예수로 예수로 충만함이라\n난 예수로 예수로\n예수로 충만하네\n세상 모든 것들도\n부럽지 않네\n난 예수로 예수로\n예수로 충만하네\n영원한 왕 내 안에\n살아계시네\n난 예수로 예수로\n예수로 충만하네\n세상 모든 풍파도\n두렵지 않네\n난 예수로 예수로\n예수로 충만하네\n영원한 왕 내안에\n살아계시네\n영원한 왕 내안에\n살아계시네"}, {"title": "유년/유아부 특송", "lyrics": "Verse1\n주의 자비가 내려와 내려와\n주의 자비가 봄비같이\n주의 자비가 내려와 나를 덮네\nVerse2\n헤이 호! 주의 자비하심과\n헤이 호! 주의 은혜로\n헤이 호! 나는 영원히 춤추리\nVerse3\n빰빠밤빠 메리 크리스마스\n빰빠밤빠 메리 크리스마스\n기쁜 이 날 우리 모두 축하해요\nVerse4\n빰빠밤빠 메리 크리스마스\n빰빠밤빠 메리 크리스마스\n기쁜 이 날 우리 모두 \n예수님을 축하해요\nVerse5\n나를 위해 오신 아기 예수님\n나도 예수님을 따라 사랑 나누며 살래요\n메리 크리스마스"}, {"title": "기뻐하며 경배하세", "lyrics": "Verse1\n기뻐하며 경배하세\n영광의 주 하나님\n주 앞에서 우리 마음\n피어나는 꽃 같아\n죄와 슬픔 사라지고\n의심 구름 걷히니\n변함 없는 기쁨의 주\n밝은 빛을 주시네\nVerse2\n땅과 하늘 만물들이\n주의 솜씨 빛 내고\n별과 천사 노랫 소리\n끊임 없이 드 높아\n물과 숲과 산과 골짝\n들판이나 바다나\n모든 만물 주의 사랑\n기뻐 찬양 하여라\nVerse3\n우리 주는 사랑이요\n빛과 진리 이시니\n삶이 기쁜 샘이 되어\n바다처럼 넘치네\n아버지의 사랑 안에\n우리 모두 형제니\n서로서로 사랑하게\n도와주시옵소서\nVerse4\n새벽 별의 노래 따라\n힘찬 찬송 부르니\n주의 사랑 줄이 되어\n한 맘되게 하시네\n노래하며 행진하여\n싸움에서 이기고\n승전가를 높이 불러\n주께 영광 돌리세"}, {"title": "기뻐하며 경배하세", "lyrics": ""}, {"title": "대학부 크리스마스 특송", "lyrics": "The first Noel \nthe angels did say\nWas to certain poor shepherds \nin fields as they lay\nIn fields where they \nlay keeping their sheep,\nOn a cold winter's night \nthat was so deep.\nNoel, Noel, Noel, Noel,\nBorn is the King of Israel.\nThey looked up \nand saw a star\nShining in the East \nbeyond them far.\nAnd to the earth \nit gave great light\nAnd so it continued \nboth day and night.\nNoel, Noel, Noel, Noel,\nBorn is the King of Israel.\nNoel, Noel, Noel, Noel,\nBorn is the King of Israel.\nJoy to the world! The Lord is come\nLet earth receive her King.\nLet every heart \nprepare Him room\nAnd heav'n and nature sing,\nand heav'n and nature sing\nand heav'n and heav'n \nand nature sing.\nJoy to the world! The Savior reigns,\nlet men their songs employ.\nWhile fields and floods, \nrocks, hills and plains\nRepeat the sounding joy,\nRepeat the sounding joy.\nRepeat, \nrepeat the sounding joy.\nHe rules the world \nwith truth and grace,\nand makes \nthe nations prove\nThe glories of \nHis righteousness,\nAnd wonders of His love,\nand wonders of His love,\nAnd wonders, \nwonders of His love."}, {"title": "O Holy Night 특송", "lyrics": "O holy night\nThe stars are brightly shining\nIt is the night of our \ndear Savior's birth\nLong lay the world\nIn sin and error pining\nTill He appeared \nand the soul felt its worth\nA thrill of hope, \nthe weary world rejoices\nFor yonder breaks, \na new and glorious morn\nFall on your knees\nOh, hear the angel voices\nOh night divine\nOh night when was \nChrist was born\nO night divine, \nO night, O night divine!\nTruly, He taught us \nto love one another\nHis law is love \nand His gospel is peace\nChains shall He break, \nfor the slave is our brother\nAnd then His name \nall oppression shall cease\nSweet hymns of joy \nin grateful chorus raise we,\nLet all within us praise \nHis holy name\nChrist is the Lord\nHis name forever praise we\nNoel, Noel\nOh night, oh night divine\nNoel, Noel\nOh night, oh night divine\n(Noel, Noel\nOh night, oh night divine)"}, {"title": "가리워진 길", "lyrics": "Verse\n보일 듯 말 듯 가물거리는\n안개 속에 싸인 길\n잡힐 듯 말 듯 멀어져가는\n무지개와 같은 길\n그 어디에서 날 기다리는지\n둘러보아도 찾을 수 없네\n그대여 힘이 돼주오\n나에게 주어진 길 찾을 수 있도록\n그대여 길을 터주오\n가리워진 나의 길\n이리로 가나 저리로 갈까\n아득하기만 한데\n이끌려 가듯 떠  "lyrics": "Verse\n왕이신 하나님 높임을 받으소서 \n찬양하리라\n영원히 높임을 받으실 그 이름 \n찬양하리라\nChorus 1\n그리스도 진리로 다스리네\n기뻐하라 온 땅이여 찬양하라\n거룩하신 그 이름 높이리라\nChorus 2\n그리스도 진리로 다스리네\n기뻐하라 온 땅이여 찬양하라\nBridge\n&#xA;\n주 이름으로 오셨네\n포로된 자를 자유케\n눈 먼 자 보게 하시네\n주님의 나라 영광 중에 임했네\n선포하리 \n이 땅 회복 하신 주\nTag\n거룩하신 그 이름 높이리라"}, {"title": "예수의 길", "lyrics": "Verse\n안개 속에서 주님을 보네\n아무도 없을 것 같던 그 곳에서\n손 내미셔서 나를 붙드네\n길 잃고 쓰러져 가던 그 곳에서\nPrechorus\n주 말씀하시네 내 손 잡으라고\n내가 곧 길이요 진리 생명이니\n나 그 길을 보네 주 예비하신 곳\n다른 길로 돌아서지 않으리\nChorus\n예수의 길 그 좁은 길\n나는 걷네 주 손 잡고\n그 무엇도 두렵지 않네\n주님 주신 약속 내게 있으니\n세상의 길 그 험한 길\n승리하네 성령으로\n그 무엇도 바라지 않네\n저 하늘에 내 소망 있으니"}, {"title": "바다에 길을,  하늘에 빛을", "lyrics": "verse1\n빛을 잃고 한숨 가득한 삶을\n주 친히 부르시네\n나의 약함 모두 아시는 주께\n내 신을 벗습니다\nverse2\n낙심하고 고된 인생을 통해\n주의 뜻 이루시네\n갈 길 잃은 삶에 참 소망되어\n주가 역사하시네\nverse3\n낙심한 자 다시 회복하시는\n그의 구원을 보라\n묶인 자의 참된 자유되시는\n크신 주 이름 찬양\nchorus\n바다에 길을 내며\n하늘에 빛을 두신 주\n내 깊은 두려움\n다 씻어주시네\n주 품에 가득 안겨\n언약의 길을 걸으리\n한없는 그 사랑\n나 찬양하리라\ntag\n한없는 그 사랑\n나 찬양하리라"}, {"title": "사랑합니다 나의 예수님", "lyrics": "Verse\n사랑합니다 나의 예수님\n사랑합니다 아주 많이요\n사랑합니다 나의 예수님\n사랑합니다 그것 뿐예요\nChorus\n사랑한다 아들아\n내가 너를 잘 아노라\n사랑한다 내 딸아\n네게 축복 더하노라"}, {"title": "세상 흔들리고", "lyrics": "Verse 1\n세상 흔들리고\n사람들은 변하여도\n나는 주를 섬기리\n주님의 사랑은\n영원히 변하지않네\n나는 주를 신뢰해\nChorus 1\n오직 믿음으로\n믿음으로 내가 살리라\n오직 믿음으로\n믿음으로 내가 살리라\nChorus 2\n오직 의인은\n믿음으로 말미암아 살리라\n오직 의인은\n믿음으로 말미암아 살리라\nVerse 2\n믿음 흔들리고 \n사람들 주를 떠나도\n나는 주를 섬기리\n주님의 나라는 \n영원히 쇠하지 않네\n나는 주를 신뢰해"}, {"title": "내가 소망하는 아버지 나라", "lyrics": "Verse 1\n내가 소망하는 아버지 나라 \n주님 오시는 그날 완성되리\n우린 고대하네 \n주님 오시는 그날을 마라나타\n비록 부족함과 슬픔 많아도\n주를 알아갈 때 참 만족있네 \n우린 기대하네 \n주님 오시는 그날을 마라나타\nPrechorus\n주 다시 오시는 그날에 \n우린 보게 되리\n모든 나라와 모든 열방이\n주께 경배하는 그날을\nChorus\n주님의 뜻이 하늘에 이뤄지듯\n이 땅에 이뤄지는 그날\n모든 아픔 모든 눈물\n모두 씻겨지리\n부활의 영광 이 땅에 이뤄질 때\n새 노래로 찬양하리라\n주를 향한 주를 위한\n승리의 노래를 선포하리"}, {"title": "큰빛교회 주제가", "lyrics": "Verse 1\n예수 그리스도의 \n십자가 보혈이\n나를 변화시키시어 \n새롭게 하셨네 \n이제 말씀만이 \n우리 삶의 중심되어 \n하나님의 큰 빛 \n세상에 비추길 원하네\nPre-Chorus\n온 열방이 \n주의 복음 듣기까지 \n우리 교회를 통해 \n일하소서\nChorus\n복음이 삶의 중심되어 \n서로를 섬기며 나아가리 \n교회의 담장을 넘어 \n삶의 자리에서 예배하리\n복음이 삶의 중심되어 \n세상을 향해 나아가리\n우리만의 예배가 아닌 \n열방을 품으며 예배하리"}, {"title": "Amazed", "lyrics": "Bridge\nHow wide how deep\nHow great is Your love for me\nChorus\nLord I'm amazed by You\nLord I'm amazed by You\nLord I'm amazed by You\nAnd how You love me"}, {"title": "그 사랑이 내려와", "lyrics": "Verse 1\n고난 중에 주 음성 들을 수 없다 해도\n참된 진리 되신 주 나는 붙드네\n폭풍이 몰려와도 험한 길을 간대도\n믿음의 두 손 들고 주 신뢰해\nVerse 2\n주의 약속 이뤄져 소망이 넘칠 때에도\n은혜로운 주 손길 느낄 때도\n주를 향한 갈망과 겸손한 마음으로\n믿음의 두 손 들고 주 신뢰해\nPrechorus\n내게 행하신 그 놀라운 일\n생명 주신 주를 기억하네\nChorus\n그 사랑이 내려와 \n날 자유케 하셨네\n영원히 \n나는 주님의 것\n산과 골짜기에서 \n내 영혼 노래하네\n영원히\n나는 주님의 것\nChorus 2\n나의 삶 주의 것\n내 모든 삶 오직 주의 것\n나의 삶 주의 것\n내 모든 삶 오직 주의 것\nTag\n주를 향한 갈망과 겸손한 마음으로\n믿음의 두 손 들고 주 신뢰해"}, {"title": "내가 매일 기쁘께", "lyrics": "Verse1\n내가 매일 기쁘게 순례의 길 행함은 \n주의 팔이 나를 안보함이요\n내가 주의 큰 복을 받는 참된 비결은 \n주의 영이 함께 함이라\nChorus\n성령이 계시네 \n할렐루야 함께하시네\n좁은 길을 걸으며 밤낮 기뻐하는 것 \n주의 영이 함께함이라\nVerse2\n전에 죄에 바쪄서 평안함이 없을 때 \n예수 십자가의 공로 힘 입어\n그 발 아래 엎드려 참된 평화 얻음은 \n주의 영이 함께 함이라\nVerse3\n나와 동행하시고 모든 염려 아시니 \n나는 숲의 새와 같이 기쁘다\n내가 기쁜 맘으로 주의 뜻을 행함은 \n주의 영이 함께함이라\nVerse4\n세상 모든 욕망과 나의 모든 정욕은 \n십자가에 이미 못을 박았네\n어둔 밤이 지나고 무거운 짐 벗으니 \n주의 영이 함게함이라"}, {"title": "복음들고 산을", "lyrics": "복음 들고 산을 넘는 자들의 발길\n아름답고도 아름답도다\n평화 전하며 복된 소식을 외치네\n주 다스리시네\nChorus\n주 다스리시네 \n주 다스리시네"}, {"title": "보소서 주님", "lyrics": "Verse\n보소서 주님 나의 마음을 \n선한 것 하나 없습니다 \n그러나 내 모든 것 \n주께 드립니다 \n사랑으로 안으시고 \n나 새롭게 하소서\nChorus \n주님 마음 내게 주소서 \n내 아버지 \n주님 마음 내게 주소서 \n나를 향하신 주님의 뜻이 \n이루어 지도록 \n주님 마음 내게 주소서\nBridge\n내게 사랑을 가르치소서 \n당신의 마음으로 \n용서하게 하소서 \n Tag\n주의 성령 내게 채우사 \n주의 길 가게 하소서 \n주님 당신 마음 주소서"}, {"title": "변찮는 주님의 사랑과", "lyrics": "Verse 1\n변찮는 주님의 사랑과 \n거룩한 보혈의 공로를\n우리 다 찬양을 합시다 \n주님을 만나볼 때까지\n예수는 우리를 \n깨끗게 하시는 주시니\n그의 피 우리를 \n눈보다 더 희게 하셨네\nVerse 2\n우리를 깨끗게 한 피는 \n무궁한 생명의 물일세\n생명을 구원한 친구들 \n하나님 찬양을 합시다\nVerse 3"}, {"title": "우리는 주의 움직이는 교회", "lyrics": "Verse\n우리는 주의 움직이는 교회\n이곳은 주님을 위한 자리\n내가 기도하는 모든 땅 위에서\n하나님 예배 받을 그날을 고대하네\nChorus 1\n나의 노래로 주님의 성전을 지으리\n높임을 받으소서\n이스라엘의 찬송 중\n거하신 주님은 거룩하십니다\n두 손 들어 주님의 보좌를 만들고\n온 맘 다해 경배하리\n그룹 날개 사이에\n임하신 것처럼 내 위에 임하소서\nChorus 2\n하나님 우리가 이곳에 섰으니\n이 땅을 치유하소서\n하나님 우리가 어디에 있든지\n주를 높이리이다\nTag\n열방들아 주님을 송축할지어다\n그 발 아래 입 맞추라\n영원한 통치자 주 예수 그리스도\n그는 위대하신 왕"}, {"title": "기도하는 이 시간", "lyrics": "Verse1\nChorus\nVerse2\nVerse3\nVerse4"}, {"title": "낮은 자의 하나님", "lyrics": "Verse\n나의 가장 낮은 마음 \n주님께서 기뻐하시고\n작은 일에 큰 기쁨을 \n느끼게 하시는도다\n내가 지쳐 무력할 때 \n주님 내게 힘이되시고 \n아름다운 하늘나라 \n내 맘에 주시는도다\nPre-Chorus\n우리에게 축복하신 하나님 사랑 \n낮은 자를 높여주시고 \n아름다운 하늘나라 허락하시고 \n내 모든것 예비하시네\nChorus\n찬양함에 기쁨을 \n감사함에 평안을 \n간구함에 하나님\n알도록 하셨네"}, {"title": "민족의 가슴마다", "lyrics": "Verse\n오게\n하소서 \n오게\n하소서\n이 땅에 하나님의 나라가 \n이뤄지게 하옵소서\n모든 사람의 마음과 \n교회와 가정에도\n하나님 나라가 \n임하게 하여 주소서\nChorus\n주의 청년들이 \n예수의 꿈을 꾸고\n인류 구원의 \n환상을 보게 하소서\n한 손엔 복음들고 \n한 손엔 사랑을 들고\n온 땅 구석구석 누비는 \n나라되게 하소서\nBridge\n이 땅 구석구석에서 \n예수를 주로 고백하게 하소서\n하늘의 뜻 이 땅에 이뤄주소서 \n주의 나라 되게 하소서\nChorus 2\n주의 청년들이\n예수의 꿈을 꾸고\n인류 구원의\n환상을 보게 하소서\n​한 손엔 복음 들고\n한 손엔 사랑을 들고\n온 땅 구석구석 누비는\n나라 되게 하소서"}, {"title": "찬양하세", "lyrics": "Verse 1\n찬양하세 \n찬양하세\n왕께 소리높여 \n찬양드리세\n찬양 받기에 \n합당하신주님\n언제나 \n동일하신주\n무릎 꿇고서\n주이름외치세\n예수 나의왕\n예수 나의왕"}, {"title": "오 신실하신 주", "lyrics": "Verse1\n오 신실하신 주\n내 아버지여\n늘 함께 계시니\n두렴없네\n그 사랑 변찮고\n날 지키시며\n어제나 오늘이\n한결같네\nChorus\n오 신실하신 주\n오 신실하신 주\n날마다 자비를 \n베푸시며\n일용할 모든 것 \n내려주시니\n오 신실하신 주\n나의 구주\nVerse2\n봄철과 또 여름\n가을과 겨울\n해와 달 별들도\n다 주의 것\n만물이 주 영광\n드러내도다\n신실한 주 사랑\n나타내네\nVerse3\n내 죄를 사하여\n안위하시고\n주 친히 오셔서\n인도하네\n오늘의 힘되고\n내일의 소망\n주만이 만복을\n내리시네"}, {"title": "예수 나의 첫사랑 되시네", "lyrics": "Verse\n예수 나의 첫사랑 되시네\n내 첫사랑\n지존자 되신 그리스도 예수 \n찬양하리\nPrechorus\n보좌 앞에 나의 삶이 \n향기로운 제사로\n주께 드려지기 \n원하네\nChorus 1\n오직 주만 바라보며 \n나의 삶을 드리네\n다른 길은 \n찾지 않으리\nChorus 2\n나의 온전한 열정과 \n나의 찬양 되시네\n주의 길을 \n따라가리라\nTag\n주의 길을 \n따라가리라"}, {"title": "만유의 주재", "lyrics": "Verse 1\n만유의 주재 존귀하신 예수\n인자가 되신 하나님\nVerse 2\n화려한 동산 무성한 저 수목\n다 아름답고 묘하나\nVerse 3\n광명한 해와 명랑한 저 달 빛\n수많은 별들 비치나\nChorus 1\n나 사모하여 영원히 섬길\n내 영광되신 주로다\nChorus 2\n순결한 예수 더 아름다워\n봄 같은 기쁜 주시네\nChorus 3\n주 예수 빛은 더 찬란하여 \n참 비교할 수 없도다\n내 영광되신 주로다\nBridge\n내 영혼아 주를 찬양하라\n영광의 왕 만유의 주께"}, {"title": "너무 멀리 왔나요", "lyrics": "Verse 1\n너무 멀리 왔나요\n주님께 돌아가기엔\n사랑의 주님 그 품을 떠나\n내 영혼 잃어버린 지금\nVerse 2\n너무 늦은 건가요\n내 영혼 회복 하기엔\n수 많은 죄악 속에 갇혀서\n주님을 잃어버린 지금\nPrechorus\n하지만 내 영혼 주님 기다려요\n변함 없는 주님의 사랑을\n내 모습 이대로 주께 돌아가요\n나의 손을 잡아 주소서\nChorus\n다시 주님의 얼굴\n내 영혼 볼 수 있도록\n나를 구원 하소서\n다시 주의 임재 가운데\n내 영혼 살 수 있도록\nTag\n다시 주의 임재 가운데\n내 영혼 살 수 있도록"}, {"title": "주 이름 큰 능력 있도다", "lyrics": "주 이름 큰 능력 있도다\n난 믿네 그 이름\n예수의 그 이름 부를 때\n새 생명 얻었네\nPre-Chorus\n마귀는 떠나가고\n갇힌 자 자유케 해\nChorus\n모든 이름보다 더 높은 이름\n주 예수\nTag\n모든 이름보다 더 높은 이름\nTag 2\n주 예수\nVerse2\n주 이름 큰 능력 있도다\n예리한 검처럼\n예수의 그 이름 외치며\n일어나 나가세\nPre-Chorus 2\n원수는 주 발 앞에\n무너져 떠나가네"}, {"title": "주 내 소망은", "lyrics": "Verse\n주 내 소망은 주 더 알기 원합니다\n이전보다 더 가까이 가기 원합니다\n오 주의 품에 기대기만 원합니다\n주의 사랑으로 변화시켜 주시옵소서\nChorus\n주 사랑으로 날개 치며 오르게 하소서\n은밀한 곳에 영원히 영원히 거하게 하소서\n오 주의 사랑 부끄러워 않겠어요\n주의 사랑으로 변화시켜 주시옵소서\nTag\n주의 사랑으로 변화시켜 주시옵소서"}, {"title": "구주 예수 의지함이", "lyrics": "Verse1\n구주 예수 의지함이 심히 기쁜 일일세 \n영생 허락 받았으니 의심 아주 없도다 \nChorus\n예수 예수 믿는 것은 받은 증거 많도다 \n예수 예수 귀한 예수 믿음 더욱 주소서 \nVerse2\n구주 예수 의지함이 심히 기쁜 일일세 \n주를 믿는 나의 마음 그의 피에 적시네 \nVerse3\n구주 예수 의지하여 죄악 벗어 버리네 \n안위받고 영생함을 주께 모두 얻었네 \nVerse4\n구주 예수 의지하여 구원함을 얻었네  \n영원 무궁 지나도록 주여 함께 하소서"}, {"title": "나는 믿네", "lyrics": "Title\n나는 믿네\nVerse\n내게 허락하신 시련을 통해\n나의 믿음 더욱 강하게 자라나고\n험한 산과 골짜기 지나는 동안\n주께 더 가까이 나를 이끄시네\nPre-chorus\n내가 겪는 시험이 어렵고 힘겨워도\n내 주님보다 크지 않네\n내 앞의 바다가 갈라지지 않으면\n주가 나로 바다 위 걷게 하리\nChorus\n나는 믿네 주의 능력으로 \n내 삶 새롭게 되리\n나는 믿네 주의 능력으로 \n담대히 나아가리라\n주와 함께 싸워 승리하리라\n날마다 믿음으로 나 살아가리\nTag\n날마다 믿음으로 나 살아가리"}, {"title": "예수를 나의 구주 삼고", "lyrics": "Verse 1\n예수를 나의 구주삼고\n성령과 피로써 거듭나니\n이 세상에서 내 영혼이\n하늘의 영광 누리도다\n Verse 2\n온전히 주께 맡긴 내 영\n사랑의 음성을 듣는 중에\n천사들 왕래하는 것과\n하늘의 영광 보리로다\nVerse 3\n주 안에 기쁨 누림으로\n마음의 풍랑이 잔잔하니\n세상과 나는 간 곳 없고\n구속한 주만 보이도다\nChorus\n이것이 나의 간증이요\n이것이 나의 찬송일세\n나 사는 동안 끊임없이\n구주를 찬송하리로다\nTag\n구주를 찬송하리로다"}, {"title": "한사람 + 내 주의 보혈은", "lyrics": "Verse 1\n한 사람이면 충분했던 주님\n주 말씀에 순종하는 자\n한 걸음마다 하나님 말씀 의지하여\n주님의 마음에 동참하는 자\nVerse 2\n그 사람이 내가 되길 원해\n주 말씀에 순종하는 자\n한 걸음마다 하나님 말씀 의지하여\n주님의 마음에 동참하는 자\nChorus\n나를 향한 계획 \n주님이 잘 아시네\n주를 향한 나의 삶\n전심으로 주께 경배해\n주님의 뜻 선하시며\n언제나 함께하시네\n주를 향한 나의 맘\n온맘 다해 주를 신뢰해\nChorus 2\n내가 주께로 지금 가오니\n골고다의 보혈로 날 씻어주소서"}, {"title": "오 놀라운 십자가", "lyrics": "Verse 1\n주 달려 죽은 십자가 \n우리가 생각할 때에\n세상에 속한 욕심을 \n헛된 줄 알고 버리네\nVerse 2\n못 박힌 손발 보오니 \n큰 자비 나타내셨네\n가시로 만든 면류관 \n우리를 위해 쓰셨네\nChorus \n오 놀라운 십자가\n오 놀라운 십자가\n날 위해 죽으신 \n주 인해 생명 얻네\n오 놀라운 십자가\n오 놀라운 십자가\n모두 나와 주의 \n은혜를 찬양하리\nVerse 3\nWere the whole realm \nof nature mine \nThat were an offering \nfar too small\nLove so amazing, \nso divine, \nDemands my soul, \nmy life, my all"}, {"title": "우물가의 여인처럼", "lyrics": "Verse 1\n우물가의 여인처럼 난 구했네\n헛되고 헛된 것들을\n그때 주님 하신 말씀\n내 샘에 와 생수를 마셔라\nChorus\n오 주님 채우소서 \n나의 잔을 높이 듭니다\n하늘양식 내게 채워 주소서\n넘치도록 채워 주소서\nVerse 2\n많고 많은 사람들이 찾았었네\n헛되고 헛된 것들을\n주 안에 감추인 보배\n세상것과 난 비길 수 없네\nVerse 3\n내 친구여 거기서 돌아오라\n내 주의 넓은 품으로\n우리 주님 너를 반겨\n그 넓은 품에 안아주시리\nTag\n하늘양식 내게 채워 주소서\n넘치도록 채워 주소서"}, {"title": "내 영혼이 은총입어", "lyrics": "Verse 1\n내 영혼이 은총입어 중한 죄짐 벗고 보니\n슬픔많은 이 세상도 천국으로 화하도다\nChorus\n할렐루야 찬양하세 내 모든죄 사함받고\n주예수와 동행하니 그 어디나 하늘나라\nVerse 2\n주의얼굴 뵙기전에 멀리뵈던 하늘나라\n내 맘속에 이뤄지니 날로날로 가깝도다\nVerse 3\n높은산이 거친들이 초막이나 궁궐이나\n내 주예수 모신곳이 그 어디나 하늘나라"}, {"title": "예수안에 소망 있네", "lyrics": "Verse 1\n예수 안에 소망 있네\n내 빛과 힘 나의 노래\n환란 중에 도우시는 \n주 나의 견고한 반석\nChorus 1\n크신 사랑 크신 평화\n두렴에서 날 건지네\n내 위로자 내 모든 것\n주 사랑 안에 서리라\nVerse 2\n완전하신 하나님이\n우리와 같이 되셨네\n주 사랑과 그 공의로\n세상을 구원하셨네\nChorus 2\n십자가에 주 달리사\n그 진노를 거두셨네\n내 모든 죄 담당하신\n주 은혜 안에 살리라\nVerse 3\n죽임당한 세상의 빛\n어둠 속에 누이셨네\n영광스런 그의 날에\n무덤에서 부활했네\nChorus 3\n승리하신 우리 주님\n원수들을 물리쳤네\n나 주의 것 주 나의 것\n주 보혈 안에 살리라\nVerse 4\n주 예수의 능력으로\n내 속에 두려움 없네\n나의 사는 모든 순간\n주께서 다스리시네\nChorus 4\n어느 것도 주 손에서\n날 빼앗지 못하리라\n주 오실 날 기다리며\n주 능력 안에 서리라\nBridge\n굳건한 반석이시니\n그 위에 내가 서리라\n그 위에 내가 서리라"}, {"title": "사랑의 주님이", "lyrics": "Verse 1\n사랑의 주님이 날 사랑하시네\n내 모습 이대로 받으셨네\n사랑의 주님이 날 사랑하듯이\n나도 너를 사랑하며 섬기리\n주가 주신 사랑으로 섬기리\n날 사랑한 사랑으로 섬기리"}, {"title": "Jesus Messiah", "lyrics": "Verse\nHe became sin \nwho knew no sin\nThat we might become \nHis righteousness\nHe humbled himself \nand carried the cross\nPre-chorus\nLove so amazing\nLove so amazing\nChorus \nJesus Messiah\ : "주의 도를 버리고", "lyrics": "Verse 1\n주의 도를 버리고 \n헛된 꿈을 좇던 우리들\n거짓과 교만한 마음을\n용서하여 주소서\n하나님의 긍휼로\n부끄러운 우리 삶을 덮어주소서\n우리의 소망 우리의 구원\n주께 간구합니다\nVerse 2\n심한 고난을 받아\n살 소망까지 끊어지고\n죽음과 같은 고통에서\n주를 보게 하셨네\n용서받을 수 없는 나를 위해\n십자가에 달리셨으니\n주 사랑에서 그 어느 누구도\n끊을 수 없으리\nChorus\n성령의 불로\n나의 맘을 태워주소서\n성령의 불로\n나의 영혼 새롭게 하소서"}, {"title": "하나님은 우리의 피난처가 되시며", "lyrics": "Verse\n하나님은 우리의 \n피난처가 되시며 \n환난중에 우리의 \n힘과 도움이시라\nChorus 1\n너희는 가만히 있어 \n주가 하나님 됨 알지어다\n열방과 세계 가운데 \n주가 높임을 받으리라\nChorus 2\n사랑합니다 내 아버지 \n찬양합니다 내 온맘 다하여\n선포합니다 예수 그리스도 \n주님 오심을 기다리며"}, {"title": "주님의 시간에", "lyrics": "Verse 1\n주님의 시간에 \n주의 뜻 이루어지니 기다려 \nChorus 1\n하루하루 살동안 주님 인도하시니 \n주 뜻 이룰때까지 기다려 \nVerse 2\n기다려 그때를 \n주의 뜻 이뤄지길 기다려 \nChorus 2\n주의 뜻 이뤄질때 우리들의 모든것 \n아름답게 변하리 기다려 \nVerse\n주님의 시간에 \n주의 뜻 이루어지니 기다려 \n기다려 그때를 \n주의 뜻 이뤄지길 기다려 \nChorus\n하루하루 살동안 주님 인도하시니 \n주 뜻 이룰때까지 기다려 \n주의 뜻 이뤄질때 우리들의 모든것 \n아름답게 변하리 기다려"}, {"title": "주의 이름 높이며 + 승리하셨네", "lyrics": "Verse\n주의 이름 높이며 \n주를 찬양하나이다 \n나를 구하러 오신 \n주를 기뻐하나이다 \nChorus\n하늘 영광 버리고 \n이 땅 위에 \n십자가를 지시고 \n죄 사했네\n무덤에서 일어나 하늘로 올리셨네 \n주의 이름 높이리\nChorus 2\n승리하였네 어린양의 보혈로 \n우린 보혈의 능력으로 서리라 \n승리하였네 어린양의 보혈로 \n주 내게 승리 주셨네"}, {"title": "샘물과 같은 보혈은", "lyrics": "Verse1\n샘물과 같은 보혈은 \n주님의 피로다 \n보혈에 죄를 씻으면 \n정하게 되겠네\n정하게 되겠네 \n정하게 되겠네\n보혈에 죄를 씻으면 \n정하게 되겠네\nVerse2\n저 도적 회개하고서 \n보혈에 씻었네\n저 도적 같은 이 몸도 \n죄 씻기 원하네\n죄 씻기 원하네 \n죄 씻기 원하네\n저 도적 같은 이 몸도 \n죄 씻기 원하네\nVerse3\n죄 속함 받은 백성은 \n영생을 얻겠네\n샘 솟듯 하는 피 \n권세 한없이 크도다\n한없이 크도다 \n한없이 크도다\n샘 솟듯 하는 피 \n권세 한없이 크도다\nVerse4\n날 정케하신 피 보니 \n그 사랑 한 없네\n살 동안 받는 사랑을 \n늘 찬송하겠네\n늘 찬송하겠네 \n늘 찬송하겠네\n살 동안 받는 사랑을\n늘 찬송하겠네\nVerse5\n이후에 천국 올라가 \n더 좋은 노래로\n날 구속하신 은혜를 \n늘 찬송하겠네\n늘 찬송하겠네 \n늘 찬송하겠네\n날 구속하신 은혜를 \n늘 찬송하겠네"}, {"title": "하나님의 부르심", "lyrics": ""}, {"title": "주 하나님이 지으신 모든 세계", "lyrics": "Verse 1\n주 하나님 지으신 모든 세계\n내 마음 속에 그리어 볼 때\n하늘의 별 울려 퍼지는 뇌성\n주님의 권능 우주에 찼네\nVerse 2\n숲 속이나 험한 산 골짝에서\n지저귀는 저 새소리들과\n고요하게 흐르는 시냇물은\n주님의 솜씨 노래하도다\nVerse 3\n주 하나님 독생자 아낌없이\n우리를 위해 보내주셨네\n십자가에 피 흘려 죽으신 주\n내 모든 죄를 구속하셨네\nVerse 4\n내 주 예수 세상에 다시 올 때\n저 천국으로 날 인도하리\n나 겸손히 엎드려 경배하며\n영원히 주를 찬양하리라\nChorus\n주님의 높고 위대하심을\n내 영혼이 찬양하네\n주님의 높고 위대하심을\n내 영혼이 찬양하네"}, {"title": "Power Of Your Love", "lyrics": "Verse 1\nLord I come to You\nLet my heart be changed, renewed\nFlowing from the grace\nThat I've found in You\nAnd Lord I've come to know\nThe weaknesses I see in me\nWill be stripped away\nBy the power of Your love\nVerse 2\nLord unveil my eyes\nLet me see You face to face\nThe knowledge of Your love\nAs You live in me\nAnd Lord renew my mind\nAs Your will unfolds in my life\nIn living every day\nBy the power of Your love\nChorus\nHold me close\nLet Your love surround me\nBring me near\nDraw me to Your side\nAnd as I wait\nI'll rise up like the eagle\nAnd I will soar with You\nYour Spirit leads me on\nIn the power of Your love\nTag\nAnd I will soar with You\nYour Spirit leads me on\nBy the power of Your love\nTag 2\nBe near, oh God, be near \nOh God of us \nYou nearness is to us our good"}, {"title": "주님 곁으로", "lyrics": "Verse 1\n주님 곁으로 \n날 이끄소서\n내 모든 것 다 드리며\n주 음성 듣기 원하네\nVerse 2\n나의 참 소망 \n그 무엇과도\n바꿀 수 없는 주 사랑\n그 품안에 나 안기리\nChorus\n주님의 길로 \n인도하소서\n주님 만이 내 모든 것 되시니\n주님 만을 더 알게 하소서"}, {"title": "예수 그 이름", "lyrics": "verse 1\n예수 그 이름 \n나는 말할 수 없네 \n그 이름 속에 있는 비밀을 \n그 이름 속에 있는 사랑을\n그 사랑을 말할 수 없어서 \n그 풍부함 표현 못해서 \n비밀이 되었네 그이름 \n비밀이 되었네\nPrechorus\n사람들 그 이름 건축자의 \n버린 돌처럼 버렸지만\n내 마음에 새겨진 이름은 \n아름다운 보석\nChorus\n내게 있는 귀한 비밀이라\n내 마음에 숨겨진 기쁨 \n예수 오 그 이름 \n나는 말할 수 없네\nTag\n그 이름의 비밀을 \n그 이름의 사랑을 \n그 이름의 비밀을 \n그 이름의 사랑을"}, {"title": "주여 지난 밤 내 꿈에", "lyrics": "Verse1\n주여 지난 밤 내 꿈에 뵈었으니\n그 꿈 이루어 주옵소서\n밤과 아침에 계시로 보여주사\n항상 은혜를 주옵소서\n나의 놀라운 꿈 정녕 나 믿기는\n장차 큰 은혜 받을 표니\n나의 놀라운 꿈 정녕 이루어져\n주님 얼굴을 뵈오리라\nVerse2\n마음 괴롭고 아파서 낙심될 때\n내게 소망을 주셨으며\n내가 영광의 주님을 바라보니\n앞길 환하게 보이도다\n나의 놀라운 꿈 정녕 나 믿기는\n장차 큰 은혜 받을 표니\n나의 놀라운 꿈 정녕 이루어져\n주님 얼굴을 뵈오리라\nVerse3\n세상 풍조는 나날이 변하여도\n나는 내 믿음 지키리니\n인생 살다가 죽음이 꿈 같으나\n오직 내 꿈은 참되리라\n나의 놀라운 꿈 정녕 나 믿기는\n장차 큰 은혜 받을 표니\n나의 놀라운 꿈 정녕 이루어져\n주님 얼굴을 뵈오리라"}, {"title": "I could sing of your love forever", "lyrics": "Over the mountains and the sea\nYour river runs with love for me\nAnd I will open up my heart \nand let the healer set me free\nI'm happy to be in the truth\nAnd I will daily lift my hands\nFor I will always sing of \nwhen Your love came down\nI could sing of Your love forever\nI could sing of Your love forever\nI could sing of Your love forever\nI could sing of Your love forever"}, {"title": "은혜 아니면", "lyrics": "Verse \n어둠 속 헤매이던 내 영혼\n갈길 몰라 방황할 때에\n주의 십자가 영광의 그 빛이\n나를 향해 비추어주셨네\n주홍빛보다 더 붉은 내 죄\n그리스도의 피로 씻기어\n완전한 사랑 주님의 은혜로\n새 생명 주께 얻었네\n은혜 아니면 \n나 서지 못하네\n십자가의 그 사랑 능력 아니면\n나 서지 못하네\n은혜 아니면 \n나 서지 못하네\n놀라운 사랑 그 은혜 아니면\n나 서지 못하네"}, {"title": "하나님의 나팔 소리", "lyrics": "Verse 1 \n하나님의 나팔소리 천지진동 할 때에\n예수 영광 중에 구름타시고\n천사들을 세계만국 모든 곳에 보내어\n구원 얻은 성도들을 모으리\nVerse 2\n무덤 속에 잠자던 자 그때 다시일어나\n영화로운 부활승리 얻으리\n주의 택한 모든 성도 구름 타고\n오라가 공중에서 주의 얼굴 뵈오리\nVerse 3\n주님 다시 오실 날을 우리 알 수 없으니\n항상 기도하고 깨어있어서\n기쁨으로 보좌 앞에 우리 나가서도록\n그때까지 참고 기다리겠네\nChorus\n나팔 불 때 나의 이름 \n나팔 불 때 나의 이름\n \n나팔 불 때 나의 이름 \n부를 때에 잔치 참여 하겠네"}, {"title": "나는 주를 섬기는 것에 후회가 없습니다", "lyrics": "Verse 1\n나의 평생에 가장 복된 일은\n내가 예수님을 만난 것이라\n나의 평생에 가장 잘한 일은\n내가 예수님을 주로 섬긴 것이라\nVerse 2\n이 세상 살 동안 내가 걷는 길이\n때론 험하여서 넘어질 때도\n주의 강한 손이 나를 붙드시니\n나는 예수님만 주로 섬기며 살리\nChorus\n나는 주를 섬기는 것에 후회가 없습니다\n내가 걸어온 모든 시간 다 주의 은혜니\n내가 걸어갈 모든 날도 주만 섬기며 살리\n오직 예수 이름 부르며 살아가리라\nBridge\n이것이 나의 간증이요\n이것이 나의 찬송일세\n나 사는 동안 끊임없이\n구주를 찬송 하리로다\nTag\n나 사는 동안 끊임없이\n구주를 찬송 하리로다"}, {"title": "Amazing Grace - 사가목 선교팀", "lyrics": "Verse\nMahame cojejewe emeno wemaga\nMajabuyat engetmaje vishkohoni\nNinbuare nineshune doshnogo ginkego\nAgivingwe doshnogo degua\n나 같은 죄인 살리신\n주 은혜 놀라워\n잃었던 생명 찾았고\n광명을 얻었네\nAmazing grace how sweet the sound\nThat saved the wretch like me\nI once was lost but now am found\nWas blind but now I see\nMy chains are gone I've been set free\nMy God my saviour has ransomed me\nAnd like a flood His mercy reigns\nUnending love amazing grace\nMy chains are gone I've been set free\nMy God my saviour has ransomed me\nAnd like a flood His mercy reigns\nUnending love amazing grace\nUnending love amazing grace\nUnending love amazing grace\nMiguwechi  [Thank You]"}, {"title": "끝없는 사랑", "lyrics": "Verse \n하늘보다 높은 주의 사랑\n하늘에서 주 자비 내려\n영원한 사랑 알게 하소서\n너무도 깊은 주의\nChorus\n끝없는 사랑 흐르게 하소서\n주 사랑 더 알게 하소서\n나에게 부으소서\n끝없는 사랑 원합니다"}, {"title": "심자가를 참으신", "lyrics": ""}, {"title": "공감하시네", "lyrics": "Verse\n혼자서만 세상을 사는 듯이\n주가 멀어보이기만 할 때\n우리는 바라보아야 하네\n우리게 오셨던 그 주님을\n주님이 우리의 아픈 맘을 아시네\n가까이서 우리의 아픔에 공감하시네\n우리 가운데 찾아 \n오셨던 그 주님이\n우리의 모든 상황에 공감하시\n​"}, {"title": "나의 죄를 씻기는", "lyrics": "Verse 1\n나의 죄를 씻기는 \n예수의 피밖에 없네\n다시 정케 하기도 \n예수의 피밖에 없네\nVerse 2\n나를 정케 하기는 \n예수의 피밖에 없네\n사죄하는 증거도 \n예수의 피밖에 없네\nVerse 3\n나의 죄 속하기는 \n예수의 피밖에 없네\n나는 공로 없으니 \n예수의 피밖에 없네\nVerse 4\n평안함과 소망은 \n예수의 피밖에 없네\n나의 의는 이것뿐 \n예수의 피밖에 없네\nVerse 5\n영원토록 내 할 말 \n예수의 피밖에 없네\n나의 찬미 제목은 \n예수의 피밖에 없네\nChorus\n예수의 흘린 피 \n날 희게 하오니\n귀하고 귀하다 \n예수의 피밖에 없네"}, {"title": "주 예수님 내 맘에 오사", "lyrics": "Verse 1 \n주 예수님 내 맘에 오사 \n날 붙들어 주시고\n내 마음에 새 힘을 주사\n늘 기쁘게 하소서\nVerse 2\n주 예수님 내 맘에 오사\n내 소원 다 아시고\n내 무거운 짐 맡아주사\n참 평안을 주소서\nVerse 3\n주 예수님 내 맘에 오사\n날 정결케 하시고\n그 은혜를 내 맘에 채워 \n늘 충만케 하소서\nVerse 4\n주 예수님 내 맘에 오사\n내 길 인도하시고\n주 성령을 내 맘에 채워\n늘 충만케 하소서\nChorus\n사랑의 주 사랑의 주\n내 맘 속에 찾아오사\n내 모든 죄 사하시고 \n내 상한 맘 고치소서"}, {"title": "나의 왕 나의 주", "lyrics": "Verse\n나의 왕 나의 주\n내 삶은 주 안에 있네\n나의 왕 나의 주\n내 삶은 주를 높이네\nPre-Chorus\n주 찬양합니다 주 경배합니다\n내 마음 다하여 주께\nChorus\n주 나의 친구되시고 내 영원한\n기쁨 되시네 찬양해\n주 나의 소망되시고 내 영원한\n빛이 되시네 찬양해"}, {"title": "설후찬", "lyrics": "Verse\n말씀 앞에서 경외함으로\n주께 홀로 섭니다\n생명의 말씀 읽고 순종해\n주를 예배합니다\nPreChorus\n기록된 말씀 힘이 있어서\n진리로 우릴 거룩케 하며\n거룩한 말씀 세세 영원히\n복음이 되어 말씀하시네\nChorus 1\n하나님 말씀에 두려워 떠는 자\n그 말씀에 생명을 거는 자\n한 사람 찾으시는 \n주님의 약속을 믿어\nChorus 2\n하나님 말씀에 운명을 거는 자\n순종하며 주 따라가는 자\n영원한 하나님 나라 이뤄갈\n주의 교회여 일어나라\nBridge\n주 말씀은 우리를 구원에 \n이르는 지혜이니 \n목숨과 네 뜻 다 해\n그 말씀에 복종하라\ntag\n일어나라"}, {"title": "말씀 앞에서", "lyrics": "Verse\n말씀 앞에서 경외함으로\n주께 홀로 섭니다\n생명의 말씀 읽고 순종해\n주를 예배합니다\nPre-Chorus\n기록된 말씀 힘이 있어서\n진리로 우릴 거룩케 하며\n거룩한 말씀 세세 영원히\n복음이 되어 말씀하시네\nChorus 1\n하나님 말씀에 두려워 떠는 자\n그 말씀에 생명을 거는 자\n한 사람 찾으시는 \n주님의 약속을 믿어\nChorus 2\n하나님 말씀에 운명을 거는 자\n순종하며 주 따라가는 자\n영원한 하나님
